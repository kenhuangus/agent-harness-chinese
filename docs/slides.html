er'</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">            <span class=\"tok-str\">\"permissionDecisionReason\"</span>: reason,</span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\">        }}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">19</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">20</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">GuardrailsEngine</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">audit_ast_and_secrets</span>(<span class=\"tok-kw\">self</span>, file_path: <span class=\"tok-typ\">str</span>, code_content: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">list</span>[<span class=\"tok-typ\">str</span>]]:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">22</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 21-25 行: 多厂商敏感凭据扫描 + AST 语法解析预检</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">23</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        ast.<span class=\"tok-fn\">parse</span>(code_content, filename=file_path)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">24</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-typ\">re</span>.<span class=\"tok-fn\">search</span>(r<span class=\"tok-str\">\"(sk-proj-[A-Za-z0-9_\\-]{20,}|AKIA[0-9A-Z]{16})\"</span>, code_content):</span></div>\n<div class=\"code-line\"><span class=\"line-num\">25</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span>, [<span class=\"tok-str\">\"CRITICAL: Hardcoded API secret key detected!\"</span>]</span></div>\n<div class=\"code-line\"><span class=\"line-num\">26</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span>, [<span class=\"tok-str\">\"AST syntax valid. Zero secrets.\"</span>]</span></div>"}, {"number": 21, "raw_lines": ["模块 5：权限提权网关与分级审批矩阵", "按操作风险等级实施差异化执行策略与不可变凭证审计", "| 风险等级 | 工具类型 | 本教程实验中的执行动作 |", "|---|---|---|", "| LOW (低风险) | read_file, list_dir, grep | 自动放行 (Auto-approve) |", "| MEDIUM (中风险) | write_file, run_test | 记录审计日志并在沙箱内执行 |", "| HIGH (高风险) | pip_install | 增强型审计，记录依赖变更后放行 |", "| CRITICAL (极高风险) | git_push, db_drop | 严格拦截，必须校验 approvals.json 凭证 |", "• 实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_05_break_and_qna/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_05_break_and_qna/permission_escalation_gateway.py", "code_language": "python", "highlight_lines": [5, 9, 13, 14, 15, 16, 17, 18], "code_block": "class PermissionEscalationGateway:\n    def evaluate_request(self, tool_name: str, params: dict, request_id: str) -> dict:\n        risk = self.risk_matrix.get(tool_name, \"HIGH\")\n\n        # 第 5-7 行: LOW 低风险操作 (只读) -> 自动放行\n        if risk == \"LOW\":\n            return {\"allowed\": True, \"content\": (self.workspace / params[\"path\"]).read_text(\"utf-8\")}\n\n        # 第 9-11 行: MEDIUM 中风险操作 (写入) -> 记录日志并在工作区沙箱执行\n        if risk == \"MEDIUM\":\n            (self.workspace / params[\"path\"]).write_text(params[\"content\"], encoding=\"utf-8\")\n            return {\"allowed\": True, \"path\": str(self.workspace / params[\"path\"])}\n\n        # 第 13-20 行: CRITICAL 极高风险操作 (git_push) -> 严格由 approvals.json 审批凭证准入\n        if risk == \"CRITICAL\":\n            approvals = self._approvals()  # 读取 approvals.json\n            if request_id not in approvals:\n                self._log({\"event\": \"ESCALATION_BLOCKED\", \"request_id\": request_id})\n                return {\"allowed\": False, \"reason\": \"missing_approval\"}\n            pending = {\"request_id\": request_id, \"approved_by\": approvals[request_id]}\n            (self.workspace / \"pending_push.json\").write_text(json.dumps(pending, indent=2), encoding=\"utf-8\")\n            return {\"allowed\": True, \"pending_push\": str(self.workspace / \"pending_push.json\")}", "raw_lines": ["模块 5 代码实战：权限提权网关与审计账本", "File: course_implementation/module_05_break_and_qna/permission_escalation_gateway.py", "• [第 5 行] 风险自动分级：对安全只读操作 (LOW 风险) 实现毫秒级自动放行，兼顾开发流程度。", "• [第 9 行] 沙箱记录与写入：对文件修改操作 (MEDIUM 风险) 记录变更审计日志并在工作区内执行。", "• [第 14-18 行] 极高风险凭证准入：通过 approvals.json 严格校验 git_push 等关键操作，并生成 pending_push.json 待办审计文件。"], "number": 22, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">PermissionEscalationGateway</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">evaluate_request</span>(<span class=\"tok-kw\">self</span>, tool_name: <span class=\"tok-typ\">str</span>, params: <span class=\"tok-typ\">dict</span>, request_id: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        risk = <span class=\"tok-kw\">self</span>.risk_matrix.<span class=\"tok-fn\">get</span>(tool_name, <span class=\"tok-str\">\"HIGH\"</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 5-7 行: LOW 低风险操作 (只读) -&gt; 自动放行</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> risk == <span class=\"tok-str\">\"LOW\"</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"allowed\"</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">\"content\"</span>: (<span class=\"tok-kw\">self</span>.workspace / params[<span class=\"tok-str\">\"path\"</span>]).<span class=\"tok-fn\">read_text</span>(<span class=\"tok-str\">\"utf-8\"</span>)}</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 9-11 行: MEDIUM 中风险操作 (写入) -&gt; 记录日志并在工作区沙箱执行</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> risk == <span class=\"tok-str\">\"MEDIUM\"</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">            (<span class=\"tok-kw\">self</span>.workspace / params[<span class=\"tok-str\">\"path\"</span>]).<span class=\"tok-fn\">write_text</span>(params[<span class=\"tok-str\">\"content\"</span>], encoding=<span class=\"tok-str\">\"utf-8\"</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"allowed\"</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">\"path\"</span>: <span class=\"tok-typ\">str</span>(<span class=\"tok-kw\">self</span>.workspace / params[<span class=\"tok-str\">\"path\"</span>])}</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">核心</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 13-20 行: CRITICAL 极高风险操作 (git_push) -&gt; 严格由 approvals.json 审批凭证准入</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> risk == <span class=\"tok-str\">\"CRITICAL\"</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            approvals = <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">_approvals</span>()  <span class=\"tok-com\"># 读取 approvals.json</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">17</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> request_id <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">in</span> approvals:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">核心</span><span class=\"line-code\">                <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">_log</span>({<span class=\"tok-str\">\"event\"</span>: <span class=\"tok-str\">\"ESCALATION_BLOCKED\"</span>, <span class=\"tok-str\">\"request_id\"</span>: request_id})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">19</span><span class=\"line-code\">                <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"allowed\"</span>: <span class=\"tok-kw\">False</span>, <span class=\"tok-str\">\"reason\"</span>: <span class=\"tok-str\">\"missing_approval\"</span>}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">20</span><span class=\"line-code\">            pending = {<span class=\"tok-str\">\"request_id\"</span>: request_id, <span class=\"tok-str\">\"approved_by\"</span>: approvals[request_id]}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">            (<span class=\"tok-kw\">self</span>.workspace / <span class=\"tok-str\">\"pending_push.json\"</span>).<span class=\"tok-fn\">write_text</span>(<span class=\"tok-typ\">json</span>.<span class=\"tok-fn\">dumps</span>(pending, indent=2), encoding=<span class=\"tok-str\">\"utf-8\"</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">22</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"allowed\"</span>: <span class=\"tok-kw\">True</span>, <span class=\"tok-str\">\"pending_push\"</span>: <span class=\"tok-typ\">str</span>(<span class=\"tok-kw\">self</span>.workspace / <span class=\"tok-str\">\"pending_push.json\"</span>)}</span></div>"}, {"number": 23, "raw_lines": ["模块 6：测试作为智能体的确定性可靠性层", "为什么单元测试是智能体闭环中唯一的确定性真理来源", "• 测试即真理来源：大模型的自评存在严重幻觉与偏见；只有通过独立 pytest 子进程执行的断言才是绝对客观的真理标准。", "• TDA (测试驱动智能体) 修复循环：智能体编写代码 ➔ 运行 pytest ➔ 捕获失败堆栈 ➔ 提取精确 Traceback 注入上下文 ➔ 精准定向修复。", "• 智能体自动防回归机制 (Anti-Regression)：当修复 Bug 后，自动追加防御性测试断言，确保历史错误绝不再次重现。", "• 全面测试层级：单元测试 (Unit) ➔ 确定性驾驭契约测试 (Harness Contract) ➔ 仿真多智能体集成测试 (Simulation)。"]}, {"number": 24, "raw_lines": ["智能体系统的分层测试金字塔", "三层分级测试保障体系", "• 1. 业务单元测试 (Unit Level)：验证具体业务逻辑正确性 (test_auth.py, test_calculator.py)。", "• 2. 驾驭契约测试 (Harness Contract Level)：验证拦截钩子、路径沙箱与 Token 预算策略是否生效。", "• 3. 仿真与集成测试 (Simulation / Multi-Agent)：验证多智能体通信协议、任务流转与最终交付物质量。"]}, {"number": 25, "raw_lines": ["Pytest 本地捕获 vs. 外部云端可观测性平台", "执行期闭环修复与生产后置监控的协同分工", "• Pytest 本地实时反馈：在开发时子进程运行；毫秒级捕获异常 Traceback 并直接驱动智能体自愈修复。", "• 云端可观测性平台 (LangSmith / Arize Phoenix / Braintrust)：在生产环境收集分布式调用链路、Token 消耗统计与长周期评测。", "• 黄金工程实践：优先在本地利用 Pytest 完成高频确定性自愈，再将全局 Trace 汇总至云端监控平台。"]}, {"number": 26, "raw_lines": ["防回归测试套件构建 (Anti-Regression)", "防止智能体在迭代中破坏已有功能或重复犯错", "• 历史缺陷固化：每解决一个 Bug，必须由智能体或开发者自动向测试套件追加对应的防回归断言。", "• 零回归保证：每次提交前必须全量通过所有防回归测试集，确保已修复问题永不复发。", "• 边界与极端场景覆盖：针对空输入、零除异常、类型溢出等极端场景构建刚性防御测试用例。"]}, {"number": 27, "raw_lines": ["智能体评估驾驭体系 (Agentic Evaluation Harness)", "如何科学评估非确定性系统的工业级质量", "• 确定性断言评估：针对代码执行结果、返回数据 Schema 与 HTTP 状态码进行二进制 (Pass/Fail) 判定。", "• LLM-as-a-Judge 语义评测：针对文档可读性、报告详实度等主观指标，制定评分标准让独立大模型打分。", "• 综合生产就绪度评分：结合自动化测试通过率与准入安全门禁，生成量化可审计的就绪度雷达图。"]}, {"slide_type": "code", "code_filename": "course_implementation/module_06_tests_as_reliability/tda_reliability_pipeline.py", "code_language": "python", "highlight_lines": [6, 7, 8, 12, 13, 14, 20, 21, 22], "code_block": "class TDAReliabilityPipeline:\n    def run_pytest(self, test_path: str) -> tuple[bool, str]:\n        # 第 5-8 行: 启动独立 pytest 子进程，隔离捕获真实退出码与终端输出\n        cmd = [sys.executable, \"-m\", \"pytest\", test_path, \"-q\", \"--tb=short\"]\n        proc = subprocess.run(cmd, capture_output=True, text=True)\n        return (proc.returncode == 0), (proc.stdout + proc.stderr)\n\n    def extract_failure_traceback(self, pytest_output: str) -> str:\n        # 第 11-15 行: 提取精准堆栈与异常类型 (ZeroDivisionError)，注入自愈提示词\n        lines = pytest_output.splitlines()\n        failures = [l for l in lines if \"FAILED\" in l or \"Error\" in l]\n        return \"\\n\".join(failures[-8:]) if failures else \"Unknown failure\"\n\n    def append_anti_regression_test(self, test_file: str, new_test_code: str) -> None:\n        # 第 19-23 行: 自动追加防回归测试用例，确保历史缺陷永不再现\n        path = self.workspace / test_file\n        current = path.read_text(\"utf-8\") if path.exists() else \"\"\n        path.write_text(current + \"\\n\\n\" + new_test_code, encoding=\"utf-8\")", "raw_lines": ["模块 6 代码实战：TDA Pytest 子进程与防回归自愈闭环", "File: course_implementation/module_06_tests_as_reliability/tda_reliability_pipeline.py", "• [第 6-8 行] Pytest 子进程隔离执行：使用 sys.executable 启动独立 pytest 进程，捕获原生 stdout/stderr 输出。", "• [第 12-14 行] 堆栈精准提取：过滤无关噪声，提取 exact Traceback 与错误类型 (如 ZeroDivisionError) 注入自愈提示词。", "• [第 20-22 行] 防回归测试自动追加：修复缺陷后自动向 test_calculator.py 写入测试断言，确保系统稳定性只增不减。"], "number": 28, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">TDAReliabilityPipeline</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">run_pytest</span>(<span class=\"tok-kw\">self</span>, test_path: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 5-8 行: 启动独立 pytest 子进程，隔离捕获真实退出码与终端输出</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        cmd = [<span class=\"tok-typ\">sys</span>.executable, <span class=\"tok-str\">\"-m\"</span>, <span class=\"tok-str\">\"pytest\"</span>, test_path, <span class=\"tok-str\">\"-q\"</span>, <span class=\"tok-str\">\"--tb=short\"</span>]</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\">        proc = <span class=\"tok-typ\">subprocess</span>.<span class=\"tok-fn\">run</span>(cmd, capture_output=<span class=\"tok-kw\">True</span>, text=<span class=\"tok-kw\">True</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> (proc.returncode == 0), (proc.stdout + proc.stderr)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">核心</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">extract_failure_traceback</span>(<span class=\"tok-kw\">self</span>, pytest_output: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">str</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 11-15 行: 提取精准堆栈与异常类型 (ZeroDivisionError)，注入自愈提示词</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        lines = pytest_output.<span class=\"tok-fn\">splitlines</span>()</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\">        failures = [l <span class=\"tok-kw\">for</span> l <span class=\"tok-kw\">in</span> lines <span class=\"tok-kw\">if</span> <span class=\"tok-str\">\"FAILED\"</span> <span class=\"tok-kw\">in</span> l <span class=\"tok-kw\">or</span> <span class=\"tok-str\">\"Error\"</span> <span class=\"tok-kw\">in</span> l]</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-str\">\"\\n\"</span>.<span class=\"tok-fn\">join</span>(failures[-8:]) <span class=\"tok-kw\">if</span> failures <span class=\"tok-kw\">else</span> <span class=\"tok-str\">\"Unknown failure\"</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">核心</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">append_anti_regression_test</span>(<span class=\"tok-kw\">self</span>, test_file: <span class=\"tok-typ\">str</span>, new_test_code: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 19-23 行: 自动追加防回归测试用例，确保历史缺陷永不再现</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        path = <span class=\"tok-kw\">self</span>.workspace / test_file</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        current = path.<span class=\"tok-fn\">read_text</span>(<span class=\"tok-str\">\"utf-8\"</span>) <span class=\"tok-kw\">if</span> path.<span class=\"tok-fn\">exists</span>() <span class=\"tok-kw\">else</span> <span class=\"tok-str\">\"\"</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\">        path.<span class=\"tok-fn\">write_text</span>(current + <span class=\"tok-str\">\"\\n\\n\"</span> + new_test_code, encoding=<span class=\"tok-str\">\"utf-8\"</span>)</span></div>"}, {"number": 29, "raw_lines": ["模块 7：智能体扩展机制 —— Skills、Plugins 与 MCP 协议", "标准化的智能体能力扩展与多协议接入体系", "• Agent Skills 架构：以 SKILL.md 为核心的声明式能力清单，包含元数据、触发指令与参考文档。", "• Claude Code Plugin 架构：通过 .claude-plugin/plugin.json 清单打包多个技能、拦截钩子与 MCP 服务。", "• Model Context Protocol (MCP 2.x)：Anthropic 开源的工业级上下文协议，统一管理 Tools、Resources 与 Prompts。", "• 五大扩展机制横向选型：MCP 协议 vs. 命令行 CLI vs. Agent Skill vs. Plugin 插件 vs. 生命周期 Hook。", "• 实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_07_agent_extensions_mcp/README.md"]}, {"number": 30, "raw_lines": ["Agent Skills 架构与标准目录结构规范", "以 SKILL.md 为核心的工业级智能体技能包规范", "• 核心清单 (SKILL.md)：包含 YAML Frontmatter 元数据 (name, description) 与详细的操作提示词。", "• 辅助脚本库 (scripts/)：存放供智能体按需调用的 Python/Bash 工具脚本，降低上下文占用。", "• 参考文档库 (references/)：存放高阶 API 文档与设计规范，支持智能体精准按需检索。", "• 资产与模板 (assets/)：存放预设的配置模板与静态资源。"]}, {"number": 31, "raw_lines": ["插件架构：plugin.json 清单 vs. marketplace.json 市场分发", "从单体技能打包到企业级插件市场分发机制", "• 插件清单 (.claude-plugin/plugin.json)：定义插件名称、版本、入口技能、预置 MCP 服务器及关联钩子。", "• 市场清单 (marketplace.json)：用于企业内部私有仓库或官方社区的插件发现、版本索引与依赖解析。", "• 一键安装分发：支持通过声明式配置文件快速在多团队之间分发复用标准化驾驭插件。"]}, {"number": 32, "raw_lines": ["模型上下文协议 (MCP 2.x) 架构与协议演进", "基于 JSON-RPC 2.0 的跨平台统一协议架构", "• 协议通信基础：基于 stdio 标准输入输出或 HTTP/SSE 构建的双向 JSON-RPC 2.0 消息通道。", "• 核心能力三大支柱：", "  • 1. Tools (工具执行)：智能体可调用的具体执行函数 (@mcp.tool())。", "  • 2. Resources (只读资源)：供智能体读取的应用上下文与系统文件 (@mcp.resource())。", "  • 3. Prompts (预设提示词)：由服务器提供的结构化交互模板。"]}, {"number": 33, "raw_lines": ["Model Context Protocol (MCP) 服务器安全加固指南", "防止 MCP 成为智能体执行链中的安全后门", "• 输入参数强校验：对所有 Tool 输入参数进行严格的 Schema 检查，拒绝危险字符与命令注入。", "• 凭证与秘钥隔离：严禁在 MCP 响应日志中明文打印 API Key，使用安全环境变量传递。", "• 传输层加密与鉴权：针对远程 MCP 必须启用 mTLS 双向认证与 OAuth2 令牌校验。"]}, {"number": 34, "raw_lines": ["智能体扩展机制全方位对比：MCP vs. CLI vs. Skill vs. Plugin vs. Hook", "五大扩展维度的架构特性、执行开销与选型矩阵", "• Model Context Protocol (MCP)：跨语言、跨智能体通用标准协议；适合连接企业数据源与已有外部系统。", "• 命令行工具 (CLI)：轻量简单，但缺乏结构化 Schema 与内生鉴权控制；适合简单脚本调用。", "• Agent Skill (技能)：面向 Prompt 与上下文的知识库/工作流打包；适合定义垂直业务专长。", "• Plugin (插件体系)：包含 Skill、Hook 与 MCP 的全功能分发载体；适合团队级标准化能力共享。", "• Lifecycle Hook (钩子)：毫秒级确定性拦截与阻断；专为安全防护、语法审计与驾驭策略而生。"]}, {"number": 35, "raw_lines": ["多智能体设计模式与生产加固框架", "企业级长周期自主多智能体系统的工业级设计模式", "• 职责解耦模式 (Role Separation)：将大任务拆分给规划者 (Planner)、执行者 (Implementer) 与审查者 (Reviewer)。", "• 物理环境隔离 (Physical Isolation)：每个子智能体运行在独立的临时 Git Worktree 中，杜绝文件并发读写冲突。", "• 确定性合并守卫 (Merge Gate)：在子智能体产物合并至主分支前，必须 100% 通过自动化测试与准入审计。"]}, {"slide_type": "code", "code_filename": "course_implementation/module_07_agent_extensions_mcp/mcp_server_demo.py", "code_language": "python", "highlight_lines": [5, 6, 7, 8, 9, 13, 14, 15, 16, 21, 22, 23, 24, 25], "code_block": "from mcp.server.fastmcp import FastMCP\nmcp = FastMCP(\"HarnessSecurityExtension\")\n\n# 第 4-9 行: MCP 工具注册 (@mcp.tool()) 暴露强类型哈希与文件摘要工具\n@mcp.tool()\ndef compute_sha256(content: str) -> str:\n    \"\"\"计算代码内容的 SHA-256 完整性摘要\"\"\"\n    import hashlib\n    return hashlib.sha256(content.encode('utf-8')).hexdigest()\n\n# 第 12-16 行: MCP 只读资源注册 (@mcp.resource()) 暴露系统级监控指标\n@mcp.resource(\"harness://system-status\")\ndef get_system_status() -> str:\n    \"\"\"返回当前 Harness 治理堆栈的只读运行状态\"\"\"\n    return json.dumps({\"status\": \"HEALTHY\", \"active_hooks\": 31, \"sandbox\": \"ENABLED\"})\n\n# 第 19-25 行: 异步 stdio 客户端解析 JSON-RPC 2.0 请求与响应\nasync def call_mcp_tool(tool_name: str, arguments: dict) -> dict:\n    request = {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": f\"tools/{tool_name}\", \"params\": arguments}\n    response = await stdio_transport.send_receive(request)\n    return response.get(\"result\", {})", "raw_lines": ["模块 7 代码实战：MCP 2.x 服务器与异步 Client stdio 通信", "File: course_implementation/module_07_agent_extensions_mcp/mcp_server_demo.py", "• [第 5-9 行] MCP 工具声明 (@mcp.tool())：使用 Python 类型注解暴露规范化的安全哈希与文件摘要工具。", "• [第 13-16 行] MCP 只读资源声明 (@mcp.resource())：通过 URI (harness://system-status) 暴露只读状态数据。", "• [第 21-25 行] 异步 stdio 客户端：实现完整的 JSON-RPC 请求/响应解析，实现客户端与 MCP 服务器的高效解耦通信。"], "number": 36, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">from</span> mcp.server.fastmcp <span class=\"tok-kw\">import</span> <span class=\"tok-typ\">FastMCP</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">mcp = <span class=\"tok-typ\">FastMCP</span>(<span class=\"tok-str\">\"HarnessSecurityExtension\"</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\"><span class=\"tok-com\"># 第 4-9 行: MCP 工具注册 (@mcp.tool()) 暴露强类型哈希与文件摘要工具</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">核心</span><span class=\"line-code\"><span class=\"tok-dec\">@mcp.tool</span>()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">核心</span><span class=\"line-code\"><span class=\"tok-kw\">def</span> <span class=\"tok-fn\">compute_sha256</span>(content: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">str</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-str\">\"\"\"计算代码内容的 SHA-256 完整性摘要\"\"\"</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-kw\">import</span> <span class=\"tok-typ\">hashlib</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-kw\">return</span> <span class=\"tok-typ\">hashlib</span>.<span class=\"tok-fn\">sha256</span>(content.<span class=\"tok-fn\">encode</span>(<span class=\"tok-str\">'utf-8'</span>)).<span class=\"tok-fn\">hexdigest</span>()</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\"><span class=\"tok-com\"># 第 12-16 行: MCP 只读资源注册 (@mcp.resource()) 暴露系统级监控指标</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\"><span class=\"tok-dec\">@mcp.resource</span>(<span class=\"tok-str\">\"harness://system-status\"</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">核心</span><span class=\"line-code\"><span class=\"tok-kw\">def</span> <span class=\"tok-fn\">get_system_status</span>() -&gt; <span class=\"tok-typ\">str</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-str\">\"\"\"返回当前 Harness 治理堆栈的只读运行状态\"\"\"</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-kw\">return</span> <span class=\"tok-typ\">json</span>.<span class=\"tok-fn\">dumps</span>({<span class=\"tok-str\">\"status\"</span>: <span class=\"tok-str\">\"HEALTHY\"</span>, <span class=\"tok-str\">\"active_hooks\"</span>: 31, <span class=\"tok-str\">\"sandbox\"</span>: <span class=\"tok-str\">\"ENABLED\"</span>})</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">核心</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\"><span class=\"tok-com\"># 第 19-25 行: 异步 stdio 客户端解析 JSON-RPC 2.0 请求与响应</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\"><span class=\"tok-kw\">async</span> <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">call_mcp_tool</span>(tool_name: <span class=\"tok-typ\">str</span>, arguments: <span class=\"tok-typ\">dict</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">19</span><span class=\"line-code\">    request = {<span class=\"tok-str\">\"jsonrpc\"</span>: <span class=\"tok-str\">\"2.0\"</span>, <span class=\"tok-str\">\"id\"</span>: 1, <span class=\"tok-str\">\"method\"</span>: f<span class=\"tok-str\">\"tools/{tool_name}\"</span>, <span class=\"tok-str\">\"params\"</span>: arguments}</span></div>\n<div class=\"code-line\"><span class=\"line-num\">20</span><span class=\"line-code\">    response = <span class=\"tok-kw\">await</span> stdio_transport.<span class=\"tok-fn\">send_receive</span>(request)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">21</span><span class=\"key-badge\">核心</span><span class=\"line-code\">    <span class=\"tok-kw\">return</span> response.<span class=\"tok-fn\">get</span>(<span class=\"tok-str\">\"result\"</span>, {})</span></div>"}, {"number": 37, "raw_lines": ["模块 8：复合工程与多智能体协同 (Compound Engineering)", "通过专业化角色分工与临时 Git Worktree 实现长周期任务突破", "• 单智能体的上下文瓶颈：单智能体在处理大型项目时，上下文窗口迅速膨胀，导致幻觉倍增与逻辑混乱。", "• 复合多智能体分工：", "  • 规划者 (Planner)：负责需求分析、任务拆解与生成子契约 SPEC-SUB-01.md。", "  • 执行者 (Implementer)：在专属临时 Git Worktree 中编写代码并自运行单元测试。", "  • 审查者 (Reviewer)：审查 Git Unified Diff、核对验收标准并执行安全合规准入。", "• 实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_08_compound_engineering/README.md"]}, {"number": 38, "raw_lines": ["复合编排器架构 (Compound Orchestrator)", "管理子任务状态机、Worktree 生命周期与 Telemetry 追踪", "• 临时 Git Worktree 隔离：通过 git worktree add 创建完全隔离的工作副本，任务完成后自动清理。", "• 上下文窗口最小化：各子智能体仅加载所属子任务的专属上下文，单智能体 Token 占用降低 70% 以上。", "• 遥测审计追踪：全流程事件追加写入 telemetry.jsonl，完整记录任务流转与协同耗时。"]}, {"number": 39, "raw_lines": ["复合插件架构 (Compound Plugin Architecture)", "将复合多智能体能力封装为即插即用的企业级插件", "• 声明式团队拓扑：在 plugin.json 中声明团队角色拓扑、通信通道与各角色的可用工具集。", "• 自动化工作流编排：集成 .claude/workflows/ 自动化多步执行管线，实现无人值守的端到端交付。", "• 工业级工程合规：统一嵌入 PreToolUse 钩子与测试准入门禁，保障团队产出质量始终受控。"]}, {"number": 40, "raw_lines": ["模块 9：五步端到端生产 SOP 流程", "从需求到生产级交付物的 5-Step 工业标准操作流程", "• 步骤 1 (Spec First 规范契约)：编写 immutable SPEC.md，锁定文件白名单与验收标准。", "• 步骤 2 (Sandbox Execution 沙箱执行)：在受限 Workspace 中编写实现代码，实时拦截跨目录写入。", "• 步骤 3 (Deterministic Guardrails 确定性防护)：运行 AST 语法树解析与多厂商秘钥检测。", "• 步骤 4 (Pytest Verification 自动化验证)：在隔离子进程中运行全套测试套件，获取真实客观验证结果。", "• 步骤 5 (Unified Diff Review 审查归档)：生成标准 Git Diff 补丁并完成 events.jsonl 审计日志归档。", "• 实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_09_practical_workflow_pattern/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_09_practical_workflow_pattern/five_step_sop_pipeline.py", "code_language": "python", "highlight_lines": [4, 5, 6, 10, 11, 12, 16, 17, 18], "code_block": "class FiveStepSOPPipeline:\n    def run_sop(self, spec_path: str, proposed_code: str) -> dict:\n        # 步骤 1 & 2: 加载 SPEC.md 契约并在隔离沙箱中执行文件修改\n        spec = self.load_spec(spec_path)\n        if not self.verify_scope(spec, proposed_code):\n            return {\"status\": \"FAILED\", \"stage\": \"STEP_2_SANDBOX\"}\n\n        # 步骤 3: 运行确定性防护栏 (AST 语法分析 + 凭据泄露扫描)\n        ast_ok, issues = self.guardrails.audit_ast_and_secrets(\"app.py\", proposed_code)\n        if not ast_ok:\n            return {\"status\": \"FAILED\", \"stage\": \"STEP_3_GUARDRAILS\", \"issues\": issues}\n\n        # 步骤 4 & 5: 隔离运行 Pytest 并生成标准 Unified Diff 补丁归档\n        test_passed, test_log = self.run_pytest_verification(\"tests/\")\n        diff = self.generate_unified_diff(\"app.py\", proposed_code)\n        self.log_event(\"SOP_COMPLETED\", {\"diff_size\": len(diff), \"tests_passed\": test_passed})\n        return {\"status\": \"COMPLETED\", \"diff\": diff, \"tests_passed\": test_passed}", "raw_lines": ["模块 9 代码实战：五步 SOP 端到端自动化流水线", "File: course_implementation/module_09_practical_workflow_pattern/five_step_sop_pipeline.py", "• [第 4-6 行] 步骤 1 & 2 (规范与沙箱)：加载 SPEC.md 契约并在受限工作区内隔离生成业务代码。", "• [第 10-12 行] 步骤 3 (确定性防护)：执行 AST 语法分析与凭证泄漏扫描，拦截低级错误。", "• [第 16-18 行] 步骤 4 & 5 (测试与 Diff)：运行 pytest 子进程并生成最终 Git Unified Diff 交付物，状态标为 COMPLETED。"], "number": 41, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">FiveStepSOPPipeline</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">run_sop</span>(<span class=\"tok-kw\">self</span>, spec_path: <span class=\"tok-typ\">str</span>, proposed_code: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># 步骤 1 &amp; 2: 加载 SPEC.md 契约并在隔离沙箱中执行文件修改</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        spec = <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">load_spec</span>(spec_path)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">verify_scope</span>(spec, proposed_code):</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"status\"</span>: <span class=\"tok-str\">\"FAILED\"</span>, <span class=\"tok-str\">\"stage\"</span>: <span class=\"tok-str\">\"STEP_2_SANDBOX\"</span>}</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">        <span class=\"tok-com\"># 步骤 3: 运行确定性防护栏 (AST 语法分析 + 凭据泄露扫描)</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        ast_ok, issues = <span class=\"tok-kw\">self</span>.guardrails.<span class=\"tok-fn\">audit_ast_and_secrets</span>(<span class=\"tok-str\">\"app.py\"</span>, proposed_code)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">10</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-kw\">not</span> ast_ok:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">11</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"status\"</span>: <span class=\"tok-str\">\"FAILED\"</span>, <span class=\"tok-str\">\"stage\"</span>: <span class=\"tok-str\">\"STEP_3_GUARDRAILS\"</span>, <span class=\"tok-str\">\"issues\"</span>: issues}</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">核心</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">        <span class=\"tok-com\"># 步骤 4 &amp; 5: 隔离运行 Pytest 并生成标准 Unified Diff 补丁归档</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">        test_passed, test_log = <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">run_pytest_verification</span>(<span class=\"tok-str\">\"tests/\"</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">        diff = <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">generate_unified_diff</span>(<span class=\"tok-str\">\"app.py\"</span>, proposed_code)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">log_event</span>(<span class=\"tok-str\">\"SOP_COMPLETED\"</span>, {<span class=\"tok-str\">\"diff_size\"</span>: <span class=\"tok-typ\">len</span>(diff), <span class=\"tok-str\">\"tests_passed\"</span>: test_passed})</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">17</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"status\"</span>: <span class=\"tok-str\">\"COMPLETED\"</span>, <span class=\"tok-str\">\"diff\"</span>: diff, <span class=\"tok-str\">\"tests_passed\"</span>: test_passed}</span></div>"}, {"number": 42, "raw_lines": ["模块 10：智能体驾驭工程四大核心原则与五道生产就绪准入审查", "构建高可靠智能体系统的工程哲学与 5-Gate 生产准入标准", "• 原则 1：外部约束高于模型自觉 (External Constraints Over Model Trust)", "• 原则 2：测试断言是唯一真理来源 (Tests As The Ultimate Source of Truth)", "• 原则 3：物理隔离优于逻辑约束 (Physical Isolation Over Logical Prompts)", "• 原则 4：全流程确定性可审计 (End-to-End Deterministic Auditability)", "• 5-Gate 生产就绪度审查准入门禁：", "  • Gate 1: 记忆系统规范审查 (Memory Files Gate: CLAUDE.md, AGENTS.md 完整性)", "  • Gate 2: 确定性安全钩子门禁 (PreToolUse Hooks Gate: 危险参数与秘钥拦截配置)", "  • Gate 3: 自动化测试运行器 (Automated Test Runner Gate: 隔离 Pytest 执行机制)", "  • Gate 4: 模型上下文协议声明 (MCP Tools Gate: 标准 Schema 与只读 Resource 配置)", "  • Gate 5: 复合多智能体角色定义 (Subagents Gate: 规划/执行/审查职责清晰与 Worktree 隔离)", "• 实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_10_production_harness_principles/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_10_production_harness_principles/production_harness_audit.py", "code_language": "python", "highlight_lines": [4, 5, 6, 7, 12, 13, 14, 15, 19, 20, 21], "code_block": "class ProductionHarnessAuditor:\n    def audit_repository_gates(self, repo_path: str) -> dict:\n        # 第 4-8 行: 自动化审计五道生产就绪准入大门 (5-Gate Ready Check)\n        gates = {\n            \"Gate 1 (Memory Files)\": self.check_memory_files(repo_path),\n            \"Gate 2 (PreToolUse Hooks)\": self.check_pre_hooks(repo_path),\n            \"Gate 3 (Pytest Runner)\": self.check_pytest_runner(repo_path),\n            \"Gate 4 (MCP Declarations)\": self.check_mcp_config(repo_path),\n            \"Gate 5 (Subagent Definitions)\": self.check_subagents(repo_path),\n        }\n\n        # 第 12-16 行: 计算得分，仅当 5 门全过时授予 PRODUCTION_READY 认证徽章\n        passed_count = sum(1 for passed in gates.values() if passed)\n        status = \"PRODUCTION_READY\" if passed_count == 5 else \"GATES_FAILED\"\n        \n        # 第 18-21 行: 生成可审计的结构化评分报告\n        return {\"status\": status, \"score\": f\"{passed_count}/5\", \"gates\": gates}", "raw_lines": ["模块 10 代码实战：生产级 5-Gate 驾驭准入审计器", "File: course_implementation/module_10_production_harness_principles/production_harness_audit.py", "• [第 4-7 行] 五道准入大门检测：依次自动化审查 Memory 记忆、Hook 拦截、Pytest 测试、MCP 协议与 Subagent 定义。", "• [第 12-15 行] 生产就绪评分核算：计算通过门禁数量，仅当 5/5 全部通过时打上 PRODUCTION_READY 徽章。", "• [第 19-21 行] 结构化报告输出：输出包含各门禁状态与改进建议的完整审计报告。"], "number": 43, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">ProductionHarnessAuditor</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">audit_repository_gates</span>(<span class=\"tok-kw\">self</span>, repo_path: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">dict</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 4-8 行: 自动化审计五道生产就绪准入大门 (5-Gate Ready Check)</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        gates = {</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-str\">\"Gate 1 (Memory Files)\"</span>: <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">check_memory_files</span>(repo_path),</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-str\">\"Gate 2 (PreToolUse Hooks)\"</span>: <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">check_pre_hooks</span>(repo_path),</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-str\">\"Gate 3 (Pytest Runner)\"</span>: <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">check_pytest_runner</span>(repo_path),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">            <span class=\"tok-str\">\"Gate 4 (MCP Declarations)\"</span>: <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">check_mcp_config</span>(repo_path),</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">            <span class=\"tok-str\">\"Gate 5 (Subagent Definitions)\"</span>: <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">check_subagents</span>(repo_path),</span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        }</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 12-16 行: 计算得分，仅当 5 门全过时授予 PRODUCTION_READY 认证徽章</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        passed_count = <span class=\"tok-typ\">sum</span>(1 <span class=\"tok-kw\">for</span> passed <span class=\"tok-kw\">in</span> gates.<span class=\"tok-fn\">values</span>() <span class=\"tok-kw\">if</span> passed)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">14</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        status = <span class=\"tok-str\">\"PRODUCTION_READY\"</span> <span class=\"tok-kw\">if</span> passed_count == 5 <span class=\"tok-kw\">else</span> <span class=\"tok-str\">\"GATES_FAILED\"</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        </span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 18-21 行: 生成可审计的结构化评分报告</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> {<span class=\"tok-str\">\"status\"</span>: status, <span class=\"tok-str\">\"score\"</span>: f<span class=\"tok-str\">\"{passed_count}/5\"</span>, <span class=\"tok-str\">\"gates\"</span>: gates}</span></div>"}, {"slide_type": "comparison", "number": 44, "raw_lines": ["工作流架构对比：Graph Engineering vs. Claude Code 动态工作流", "静态有向图架构 (LangGraph) 与动态自适应驾驭架构的横向技术选型", "| 架构评测维度 | 静态图架构 (Graph Engineering / LangGraph) | Claude Code 动态自适应架构 (Dynamic Harness) |", "|---|---|---|", "| 控制模型 | 硬编码静态有向图 (StateGraph / DAG) | 动态上下文 + 31 个确定性生命周期 Hook |", "| 执行灵活性 | 流程静态固定，难以应对非预期多变任务 | 智能体自适应推理，由 Harness 驾驭系统提供刚性边界 |", "| 状态管理 | 集中式内存状态字典 (State Dict) | 分层记忆文件 (CLAUDE.md/Auto Memory) + JSONL 日志 |", "| 安全沙箱 | 依赖自定义 Python 节点逻辑 | 操作系统路径沙箱 + 提权审批网关 (approvals.json) |", "| 团队协同 | 静态条件边分支路由 (Conditional Edges) | 临时 Git Worktree 物理隔离 + 复合角色团队 |", "| 适用场景 | 流程固定严苛的流水线 (如合规表单审批) | 复杂长周期代码重构、自主研究与软件开发 |"]}, {"slide_type": "reference_tables", "number": 45, "raw_lines": ["毕业设计项目：自主深度研究智能体 —— 架构设计、执行流程与交付标准", "将驾驭系统五大支柱与五步 SOP 全面应用于长周期深度研报智能体", "| 研究 SOP 阶段 | 核心交付物 | 确定性 Harness 驾驭机制 |", "|---|---|---|", "| 1. 规范契约 | SPEC.md | 锁定研报主题、字数结构与引用数据源格式，禁止虚构引用 |", "| 2. 独立沙箱 | research_worktree/ | 隔离搜索抓取与文献下载缓存，防止污染工程主分支 |", "| 3. 确定性防护 | PreToolUse & AST | 校验学术 API 请求格式，自动过滤不可信域名与广告 |", "| 4. 自动化评测 | Pytest 校验套件 | 验证研报字数、章节完整性、Markdown 格式与可访问链接 |", "| 5. 成果归档 | FINAL_REPORT.md | 生成包含执行耗时、Token 消耗与审计摘要的最终成果 |", "• 毕业设计源码: https://github.com/kenhuangus/agent-harness-chinese/tree/main/deep_research_agent", "• 自动化验证测试套件: https://github.com/kenhuangus/agent-harness-chinese/tree/main/deep_research_agent/tests"]}, {"slide_type": "code", "code_filename": "deep_research_agent/deep_research_harness_sop.py", "code_language": "python", "highlight_lines": [4, 5, 6, 10, 11, 12, 16, 17, 18], "code_block": "class DeepResearchHarnessSOP:\n    def execute_research_pipeline(self, topic_spec: str) -> dict:\n        # 阶段 1 & 2: 加载深度研究     let currentIdx = 0;
    let isGridMode = false;

    const DENSE_BULLET_MIN_LINES = 9;
    const bodyEl = document.getElementById('slide-body');

    const selectEl = document.getElementById('slide-select');
    slidesData.forEach((s, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      const rawTitle = s.raw_lines ? s.raw_lines[0] : `第 ${s.number} 页`;
      opt.textContent = `第 ${s.number} 页: ${rawTitle.substring(0, 38)}`;
      selectEl.appendChild(opt);
    });

    function cleanNumbers(text) {
      if (!text) return '';
      text = text.replace(/^(\d+[\.\)\:]|\d+\s*&\s*\d+[\.\)\:])\s+/, '');
      return text.trim();
    }

    function formatTextWithCode(text) {
      const keywords = ['CLAUDE.md', 'AGENTS.md', 'SPEC.md', 'MEMORY.md', 'CLAUDE.local.md', 'pytest', 'events.jsonl', 'telemetry.jsonl', 'rm -rf', 'write_file', 'read_file', '.claude-plugin/plugin.json', 'SKILL.md', 'mcp_client_runner.py', 'mcp_server_demo.py', 'core_harness_stack.py', 'guardrails_engine.py', 'spec_driven_verifier.py', 'tda_reliability_pipeline.py', 'multi_agent_team_simulator.py', 'five_step_sop_pipeline.py', 'production_harness_audit.py', 'is_relative_to()', 'ast.parse()', 'PreToolUse', 'PostToolUse', 'MCPServer', 'permissionDecision', 'approvals.json', 'ZeroDivisionError', 'pending_push.json', 'scripts/', 'references/', 'assets/', '.claude/workflows/'];
      
      text = text.replace(
        /\[(.*?)\]\(((?:https?:\/\/|file:\/\/\/)[^\s<>"']+)\)/g,
        (match, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
      );

      text = text.replace(
        /(https?:\/\/[^\s<>"']+|file:\/\/\/[^\s<>"']+)/g,
        (match) => {
          let url = match.replace(/[.,;:)]+$/, '');
          let trailing = match.slice(url.length);
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
        }
      );
      
      keywords.forEach(kw => {
        text = text.replaceAll(kw, `<code>${kw}</code>`);
      });
      return text;
    }

    function copyCommand(btn, text) {
      if (!btn) return;
      const originalHtml = btn.innerHTML;
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          btn.innerHTML = '<span>✅</span> 已复制!';
          setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
        }).catch(() => {
          fallbackCopy(btn, text, originalHtml);
        });
      } else {
        fallbackCopy(btn, text, originalHtml);
      }
    }

    function fallbackCopy(btn, text, originalHtml) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        btn.innerHTML = '<span>✅</span> 已复制!';
      } catch (e) {
        btn.innerHTML = '<span>❌</span> 复制失败';
      }
      document.body.removeChild(ta);
      setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
    }

    function copyCodeFromSlide(btn, slideIdx) {
      const slide = slidesData[slideIdx];
      if (slide && slide.code_block) {
        copyCommand(btn, slide.code_block);
      }
    }

    function formatCodeConcepts(lines) {
      if (!lines || lines.length === 0) return '';
      let html = '<div class="code-concepts-list">';
      
      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('File:')) return;
        
        trimmed = trimmed.replace(/^[•\-\ufffd]\s*/, '').trim();
        
        const lineMatch = trimmed.match(/^\[(第?\s*[\d\-,\s]+行?)\]\s*([^:：]+)[:：]\s*(.*)$/i) || trimmed.match(/^\[(Lines?\s*[\d\-,\s]+)\]\s*([^:：]+)[:：]\s*(.*)$/i);
        if (lineMatch) {
          const lineTag = lineMatch[1];
          const title = lineMatch[2];
          const desc = formatTextWithCode(lineMatch[3]);
          html += `
            <div class="code-concept-card">
              <div class="concept-card-head">
                <span class="concept-tag">📌 ${lineTag}</span>
                <span class="concept-name">${formatTextWithCode(title)}</span>
              </div>
              <div class="concept-card-text">${desc}</div>
            </div>
          `;
        } else {
          const colonIdx = (trimmed.indexOf('：') !== -1) ? trimmed.indexOf('：') : trimmed.indexOf(':');
          if (colonIdx !== -1 && colonIdx < 40) {
            const title = trimmed.slice(0, colonIdx);
            const desc = formatTextWithCode(trimmed.slice(colonIdx + 1));
            html += `
              <div class="code-concept-card">
                <div class="concept-card-head">
                  <span class="concept-name">${formatTextWithCode(title)}</span>
                </div>
                <div class="concept-card-text">${desc}</div>
              </div>
            `;
          } else {
            html += `
              <div class="code-concept-card">
                <div class="concept-card-text">${formatTextWithCode(trimmed)}</div>
              </div>
            `;
          }
        }
      });
      
      html += '</div>';
      return html;
    }

    function parseMarkdownTable(lines) {
      const tableLines = lines.filter(l => l.trim().startsWith('|'));
      if (tableLines.length < 2) return null;

      let html = '<table class="slide-table">';
      let isHeader = true;

      tableLines.forEach(line => {
        const trimmed = line.trim();
        if (/^\|[\s\-:|]+\|$/.test(trimmed)) {
          isHeader = false;
          return;
        }

        const cells = trimmed.split('|').map(c => c.trim()).filter((_, idx, arr) => idx > 0 && idx < arr.length - 1);
        if (cells.length === 0) return;

        html += '<tr>';
        cells.forEach(cell => {
          const tag = isHeader ? 'th' : 'td';
          html += `<${tag}>${formatTextWithCode(cell)}</${tag}>`;
        });
        html += '</tr>';
      });

      html += '</table>';
      return html;
    }

    function formatBullets(lines) {
      if (!lines || lines.length === 0) return '';
      
      const hasTable = lines.some(l => l.trim().startsWith('|'));
      if (hasTable) {
        const beforeTable = [];
        const tableLines = [];
        const afterTable = [];
        let state = 0;

        lines.forEach(line => {
          if (state === 0) {
            if (line.trim().startsWith('|')) { state = 1; tableLines.push(line); }
            else { beforeTable.push(line); }
          } else if (state === 1) {
            if (line.trim().startsWith('|')) { tableLines.push(line); }
            else { state = 2; afterTable.push(line); }
          } else {
            afterTable.push(line);
          }
        });

        let html = '';
        if (beforeTable.length > 0) html += formatBullets(beforeTable);
        const parsedTbl = parseMarkdownTable(tableLines);
        if (parsedTbl) html += parsedTbl;
        if (afterTable.length > 0) html += formatBullets(afterTable);
        return html;
      }

      const populatedLines = lines.filter(line => line.trim());
      if (populatedLines.length === 0) return '';

      const hasIndented = populatedLines.some(l => /^\s{2,}|\t/.test(l));
      const denseClass = (!hasIndented && populatedLines.length >= DENSE_BULLET_MIN_LINES) ? ' dense-columns' : '';
      let html = '';
      let listOpen = false;
      let groupOpen = false;
      let subListOpen = false;

      populatedLines.forEach((line, idx) => {
        const isIndented = /^\s{2,}|\t/.test(line);
        const trimmed = line.trim();

        let cleanText = trimmed.replace(/^[•\-\*�]\s*/, '').trim();
        cleanText = cleanNumbers(cleanText);

        const labUrl = cleanText.match(/^Lab demo:\s*(https:\/\/[^\s]+)/i) || cleanText.match(/^交互式实验[指南|演示]*[:：]\s*(https:\/\/[^\s]+)/i);
        if (labUrl) {
          cleanText = `<a href="${labUrl[1]}" target="_blank" rel="noopener noreferrer">🔗 实战代码 Lab 演示：在 GitHub 中打开该模块</a>`;
        } else {
          cleanText = formatTextWithCode(cleanText);
        }

        if (!cleanText) return;

        if (!isIndented) {
          if (subListOpen) { html += '</ul>'; subListOpen = false; }
          if (groupOpen) { html += '</li>'; groupOpen = false; }
          if (!listOpen) { html += `<ul class="bullet-list${denseClass}">`; listOpen = true; }

          const nextLine = populatedLines[idx + 1];
          const hasChildren = nextLine && /^\s{2,}|\t/.test(nextLine);

          if (hasChildren) {
            html += `<li class="bullet-item"><span>${cleanText}</span>`;
            groupOpen = true;
          } else {
            html += `<li class="bullet-item"><span>${cleanText}</span></li>`;
          }
        } else {
          if (!groupOpen) {
            if (!listOpen) { html += `<ul class="bullet-list${denseClass}">`; listOpen = true; }
            html += `<li class="bullet-item">`;
            groupOpen = true;
          }
          if (!subListOpen) {
            html += '<ul class="sub-bullet-list">';
            subListOpen = true;
          }
          html += `<li class="sub-bullet-item"><span>${cleanText}</span></li>`;
        }
      });

      if (subListOpen) html += '</ul>';
      if (groupOpen) html += '</li>';
      if (listOpen) html += '</ul>';
      return html;
    }

                    <span class="cmd-step-title">3️⃣ 步骤 3: 以可编辑模式安装工程</span>
                    <span class="cmd-step-badge"><code>-e .</code></span>
                  </div>
                  <div class="cmd-step-desc">将驾驭工程核心包安装至当前激活的虚拟环境中：</div>
                  
                  <div class="os-cmd-group">
                    <div class="os-cmd-label">🪟 Windows (PowerShell / 命令提示符):</div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">PS&gt;</span>
                      <code class="cmd-code-text">.venv\Scripts\python.exe -m pip install -e .</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, '.venv\\Scripts\\python.exe -m pip install -e .')" title="复制 Windows 安装命令">
                        <span class="copy-icon">📋</span> 复制
                      </button>
                    </div>
                    
                    <div class="os-cmd-label" style="margin-top:0.25rem;">🍎 macOS / 🐧 Linux (Bash / Zsh):</div>
                    <div class="cmd-code-row">
                      <span class="cmd-code-prompt">$</span>
                      <code class="cmd-code-text">.venv/bin/python -m pip install -e .</code>
                      <button class="cmd-copy-btn" onclick="copyCommand(this, '.venv/bin/python -m pip install -e .')" title="复制 macOS/Linux 安装命令">
                        <span class="copy-icon">📋</span> 复制
                      </button>
                    </div>
                  </div>
                </div>

                <div class="cmd-step-card">
                  <div class="cmd-step-head">
                    <span class="cmd-step-title">4️⃣ 步骤 4: 运行全套测试验证环境</span>
                    <span class="cmd-step-badge" style="background:#e8f5e9; color:#2e7d32; border-color:#a5d6a7;">14 项通过 ✓</span>
                  </div>
                  <div class="cmd-step-desc">运行驾驭工程测试套件（预期输出 <code>Summary: 14 passed, 0 failed</code>）：</div>
                  <div class="cmd-code-row">
                    <span class="cmd-code-prompt">$</span>
                    <code class="cmd-code-text">python run_all_modules.py</code>
                    <button class="cmd-copy-btn" onclick="copyCommand(this, 'python run_all_modules.py')" title="复制步骤 4 验证命令">
                      <span class="copy-icon">📋</span> 复制
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </div>
        `;
      } else {
        bodyHtml += '<div id="slide-content-wrap" class="slide-content-wrapper">';
        if (svgMap[slide.number]) {
          bodyHtml += svgMap[slide.number];
        }
        if (restLines.length > 0) {
          bodyHtml += formatBullets(restLines);
        }
        bodyHtml += '</div>';
      }

      bodyEl.innerHTML = bodyHtml;

      // Dynamic text sizing engine - robust, non-blocking:
      if (!isCode && slide.number !== 2) {
        bodyEl.style.setProperty('--fit-scale', '1.0');
        const wrapper = document.getElementById('slide-content-wrap') || bodyEl;
        const clientH = bodyEl.clientHeight;
        if (clientH > 50) {
          const targetH = clientH * 0.90;
          let scale = 1.0;
          let growIter = 0;
          while (wrapper.offsetHeight < targetH && bodyEl.scrollHeight <= clientH && scale < 1.25 && growIter < 30) {
            scale += 0.05;
            bodyEl.style.setProperty('--fit-scale', scale.toFixed(2));
            growIter++;
          }
          let shrinkIter = 0;
          while ((bodyEl.scrollHeight > clientH || wrapper.offsetHeight > (clientH - 6)) && scale > 0.55 && shrinkIter < 40) {
            scale -= 0.02;
            bodyEl.style.setProperty('--fit-scale', scale.toFixed(2));
            shrinkIter++;
          }
        }
      } else {
        bodyEl.style.setProperty('--fit-scale', '1.0');
      }

      const progressPct = ((idx + 1) / slidesData.length) * 100;
      document.getElementById('progress-fill').style.width = progressPct + '%';
    }

    function nextSlide() {
      if (currentIdx < slidesData.length - 1) {
        renderSlide(currentIdx + 1);
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        renderSlide(currentIdx - 1);
      }
    }

    function goToSlide(idx) {
      renderSlide(parseInt(idx, 10));
    }

    function jumpToEnteredSlide() {
      const input = document.getElementById('goto-input');
      if (!input) return;
      const val = parseInt(input.value.trim(), 10);
      if (!isNaN(val) && val >= 1 && val <= slidesData.length) {
        goToSlide(val - 1);
        input.value = '';
      } else {
        alert(`请输入有效的幻灯片页码 (1-${slidesData.length})`);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Fullscreen error:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    function toggleMode() {
      isGridMode = !isGridMode;
      const presMode = document.getElementById('presentation-mode');
      const gridMode = document.getElementById('grid-mode');
      const modeText = document.getElementById('mode-text');
      const modeIcon = document.getElementById('mode-icon');

      if (isGridMode) {
        presMode.style.display = 'none';
        gridMode.style.display = 'grid';
        modeText.innerText = '幻灯片视图';
        modeIcon.innerText = '🖥️';
        renderGrid();
      } else {
        gridMode.style.display = 'none';
        presMode.style.display = 'flex';
        modeText.innerText = '网格视图';
        modeIcon.innerText = '📜';
        renderSlide(currentIdx);
      }
    }

    function renderGrid() {
      const gridContainer = document.getElementById('grid-mode');
      gridContainer.innerHTML = '';

      slidesData.forEach((slide, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-slide-card';
        card.onclick = () => {
          toggleMode();
          goToSlide(idx);
        };

        const title = document.createElement('div');
        title.className = 'grid-slide-title';
        title.innerText = `第 ${slide.number} 页: ${slide.raw_lines[0] || ''}`;

        const body = document.createElement('div');
        body.className = 'grid-slide-body';
        
        if (slide.slide_type === 'code') {
          body.innerHTML = `<code>${slide.code_filename || 'Python 代码'}</code><div style="margin-top:0.4rem; color:var(--ink);">${slide.raw_lines.slice(1).join('<br>')}</div>`;
        } else {
          const cleanDesc = (slide.raw_lines || []).slice(1).join('\n');
          body.innerText = cleanDesc;
        }

        card.appendChild(title);
        card.appendChild(body);
        gridContainer.appendChild(card);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'g' || e.key === 'G') {
        toggleMode();
      } else if (e.key === 'h' || e.key === 'H') {
        window.location.href = 'index.html';
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToSlide(slidesData.length - 1);
      }
    });

    window.addEventListener('resize', () => {
      if (!isGridMode) {
        renderSlide(currentIdx);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      let initialSlide = 0;
      if (window.location.hash) {
        const hashNum = parseInt(window.location.hash.replace('#', ''), 10);
        if (!isNaN(hashNum) && hashNum >= 1 && hashNum <= slidesData.length) {
          initialSlide = hashNum - 1;
        }
      }
      renderSlide(initialSlide);
    });
  </script>
</body>
</html>
