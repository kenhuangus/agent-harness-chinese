<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude 智能体驾驭工程实战大师课</title>
  <meta name="description" content="为非确定性 AI 编码智能体构建确定性控制与安全驾驭系统 —— 全套 47 张交互式全景课件。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <style>
    :root {
      --bg: #F0EEE6;
      --surface: #FAF9F5;
      --surface-card: #FFFFFF;
      --ink: #141413;
      --ink-muted: #6B6B63;
      --rule: #E3E0D6;
      --accent: #D97757;
      --accent-dk: #BD5D3A;
      --accent-sf: #F5E6DF;
      --font-display: ui-serif, Georgia, "Songti SC", "SimSun", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-code: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      --code-bg: #24231F;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      overflow: hidden;
    }

    header {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2rem;
      flex: 0 0 auto;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 0.35rem 0.70rem;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }
    .btn:hover {
      background: var(--accent-sf);
      border-color: var(--accent);
      color: var(--accent-dk);
    }
    .btn-primary {
      background: var(--accent);
      color: #FFFFFF !important;
      border-color: var(--accent-dk);
    }
    .btn-primary:hover {
      background: var(--accent-dk);
    }

    select.slide-select {
      background: var(--surface);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 0.35rem 0.60rem;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      max-width: 280px;
    }

    .goto-group {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .goto-input {
      width: 52px;
      padding: 0.35rem 0.40rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--surface);
      font-size: 0.84rem;
      font-weight: 600;
      text-align: center;
      color: var(--ink);
    }
    .goto-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-sf);
    }
    .btn-goto {
      padding: 0.35rem 0.55rem;
      background: var(--accent-sf);
      border-color: var(--accent);
      color: var(--accent-dk);
    }

    main {
      height: calc(100vh - 55px);
      display: flex;
      flex-direction: column;
      padding: 0.85rem;
      overflow: hidden;
    }

    .slide-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    .slide-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 12px;
      width: 100%;
      max-width: 1380px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.15rem 1.45rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.35rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.35rem;
      flex: 0 0 auto;
    }
    .slide-title-wrap { min-width: 0; }
    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2.1vw, 1.85rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--ink);
    }
    .slide-header-right {
      display: flex;
      align-items: center;
      gap: 0.60rem;
      flex: 0 0 auto;
    }
    
    .slide-num-badge {
      background: var(--accent-sf);
      color: var(--ink);
      border: 1px solid var(--rule);
      padding: 0.22rem 0.60rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 750;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .slide-body {
      --fit-scale: 1;
      --slide-body-base-size: 1.28rem;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 0.20rem;
      font-size: calc(var(--slide-body-base-size) * var(--fit-scale));
      line-height: 1.55;
      color: var(--ink);
    }

    code {
      font-family: var(--font-code);
      background: var(--accent-sf);
      color: var(--accent-dk);
      padding: 0.08rem 0.32rem;
      border-radius: 4px;
      font-size: 0.90em;
      white-space: nowrap;
      border: 1px solid var(--rule);
    }
    pre code, .tree-block code, .code-editor-body code {
      white-space: pre !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: inherit !important;
    }

    .slide-content-wrapper {
      width: 100%;
      display: block;
    }
    .slide-body > svg, .slide-svg {
      display: block;
      width: 100% !important;
      height: auto;
      max-width: 100%;
      margin: 0.35rem 0 0.65rem 0;
    }

    /* Comparison Table Styling */
    .slide-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.35rem 0 0.60rem 0;
      font-size: 0.88rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .slide-table th {
      background: var(--accent-sf);
      color: var(--ink);
      font-weight: 750;
      text-align: left;
      padding: 0.45rem 0.70rem;
      border-bottom: 1.5px solid var(--rule);
      font-family: var(--font-display);
      font-size: 0.95rem;
    }
    .slide-table td {
      padding: 0.40rem 0.70rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      vertical-align: middle;
    }
    .slide-table tr:last-child td { border-bottom: none; }
    .slide-table tr:nth-child(even) td { background: rgba(240, 238, 230, 0.4); }

    /* Bullet List & Hierarchies */
    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
      margin-top: 0.25rem;
    }
    .bullet-list.dense-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 1.25rem;
      row-gap: 0.42rem;
    }
    .bullet-item {
      position: relative;
      padding-left: 1.35rem;
      line-height: 1.48;
    }
    .bullet-item::before {
      content: "•";
      position: absolute;
      left: 0.25rem;
      color: var(--accent);
      font-weight: 800;
      font-size: 1.15em;
    }
    .sub-bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.25rem;
      padding-left: 1.10rem;
    }
    .sub-bullet-item {
      position: relative;
      padding-left: 1.10rem;
      font-size: 0.92em;
      color: var(--ink);
      line-height: 1.42;
    }
    .sub-bullet-item::before {
      content: "–";
      position: absolute;
      left: 0.20rem;
      color: var(--accent-dk);
      font-weight: 700;
    }

    /* Code Slide Split Layout */
    .code-slide-container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.10rem;
      height: 100%;
      min-height: 0;
    }
    .code-editor-window {
      background: var(--code-bg);
      border-radius: 8px;
      border: 1px solid #383733;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .code-editor-header {
      background: #1C1B18;
      padding: 0.40rem 0.80rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #33322E;
      font-family: var(--font-code);
      font-size: 0.76rem;
      color: #A0A09A;
      flex: 0 0 auto;
    }
    .code-dots {
      display: flex;
      gap: 5px;
    }
    .code-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #FF5F56; }
    .dot-yellow { background: #FFBD2E; }
    .dot-green { background: #27C93F; }
    .code-lang-tag {
      background: #2D2B27;
      padding: 0.12rem 0.40rem;
      border-radius: 4px;
      font-size: 0.70rem;
      color: #D97757;
      font-weight: 700;
    }
    .cmd-copy-btn {
      background: #2D2B27;
      border: 1px solid #44433E;
      color: #ECEBE4;
      padding: 0.15rem 0.50rem;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.12s;
    }
    .cmd-copy-btn:hover {
      background: #3E3C36;
      color: #FFFFFF;
    }
    .code-block {
      flex: 1;
      overflow: auto;
      padding: 0.75rem 0.90rem;
      font-family: var(--font-code);
      font-size: 0.84rem;
      line-height: 1.52;
      color: #F5F4EE;
    }
    .code-line {
      display: flex;
      align-items: flex-start;
      padding: 0.06rem 0;
    }
    .code-line-hl {
      background: rgba(217, 119, 87, 0.18);
      border-left: 3px solid var(--accent);
      padding-left: 0.25rem;
      margin-left: -0.25rem;
    }
    .line-num {
      width: 2.2rem;
      color: #6E6D66;
      text-align: right;
      padding-right: 0.75rem;
      user-select: none;
      flex-shrink: 0;
      font-size: 0.78rem;
    }
    .line-code {
      flex: 1;
      white-space: pre;
    }
    .key-badge {
      background: var(--accent);
      color: #FFFFFF;
      font-size: 0.60rem;
      font-weight: 800;
      padding: 0.05rem 0.25rem;
      border-radius: 3px;
      margin-right: 0.40rem;
      align-self: center;
      line-height: 1;
    }

    /* Syntax Highlighting Colors */
    .tok-kw { color: #FF7B72; font-weight: 700; }
    .tok-fn { color: #D2A8FF; font-weight: 600; }
    .tok-cls { color: #7EE787; font-weight: 700; }
    .tok-str { color: #A5D6FF; }
    .tok-com { color: #8B949E; font-style: italic; }
    .tok-typ { color: #FFA657; }
    .tok-dec { color: #79C0FF; font-weight: 600; }
    .tok-const { color: #79C0FF; font-weight: 700; }

    /* Code Concepts Column */
    .code-concepts-column {
      display: flex;
      flex-direction: column;
      gap: 0.50rem;
      overflow-y: auto;
    }
    .code-concept-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      border-left: 3px solid var(--accent);
    }
    .concept-card-head {
      display: flex;
      align-items: center;
      gap: 0.40rem;
      margin-bottom: 0.20rem;
    }
    .concept-tag {
      background: var(--accent-sf);
      color: var(--accent-dk);
      font-weight: 800;
      font-size: 0.72rem;
      padding: 0.10rem 0.40rem;
      border-radius: 4px;
      font-family: var(--font-code);
    }
    .concept-name {
      font-weight: 700;
      font-size: 0.90rem;
      color: var(--ink);
    }
    .concept-card-text {
      font-size: 0.82rem;
      line-height: 1.42;
      color: var(--ink-muted);
    }
    .invariant-card {
      background: #F4F1E8;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      margin-top: auto;
    }
    .invariant-title {
      font-weight: 800;
      font-size: 0.86rem;
      color: var(--accent-dk);
      margin-bottom: 0.20rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Instructor Slide (Slide 2) Layout */
    .instructor-slide-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.10rem;
      height: 100%;
      min-height: 0;
    }
    .instructor-info-col {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .author-books-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 0.75rem 0.95rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .author-books-header {
      font-family: var(--font-display);
      font-weight: 750;
      font-size: 0.96rem;
      color: var(--ink);
      margin-bottom: 0.60rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.40rem;
    }
    .author-books-header a {
      font-size: 0.78rem;
      color: var(--accent-dk);
      text-decoration: none;
      font-weight: 600;
    }
    .author-books-header a:hover { text-decoration: underline; }
    .books-gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
      align-items: start;
    }
    .book-item-card {
      background: #FFFFFF;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .book-item-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 4px 10px rgba(217, 119, 87, 0.15);
    }
    .book-cover-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 0.30rem;
    }
    .book-item-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      max-height: 2.4em;
      overflow: hidden;
      color: var(--ink);
    }
    .book-publisher-tag {
      font-size: 0.58rem;
      color: var(--accent-dk);
      font-weight: 800;
      margin-top: 0.15rem;
      text-transform: uppercase;
    }

    /* Slide 1 Hero & Instructor Cover Layout */
    .slide-1-container {
      display: flex;
      flex-direction: column;
      gap: 0.70rem;
      height: 100%;
      justify-content: center;
    }
    .slide-1-hero-card {
      background: linear-gradient(135deg, rgba(245, 230, 223, 0.45) 0%, rgba(250, 249, 245, 0.90) 100%);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 0.95rem 1.45rem;
      box-shadow: 0 4px 14px rgba(217, 119, 87, 0.08);
    }
    .slide-1-hero-tagline {
      font-family: var(--font-display);
      font-size: clamp(1.20rem, 2.0vw, 1.65rem);
      font-weight: 800;
      color: var(--accent-dk);
      line-height: 1.25;
      margin-bottom: 0.30rem;
      letter-spacing: -0.015em;
    }
    .slide-1-hero-desc {
      font-size: clamp(0.88rem, 1.15vw, 1.02rem);
      line-height: 1.50;
      color: var(--ink-muted);
    }
    .slide-1-instructor-card {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 0.85rem 1.35rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }
    .slide-1-avatar-wrap {
      flex-shrink: 0;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 2.5px solid var(--accent);
      padding: 2.5px;
      background: var(--accent-sf);
      box-shadow: 0 3px 8px rgba(217, 119, 87, 0.18);
    }
    .slide-1-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .slide-1-instructor-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }
    .slide-1-instructor-badge {
      background: var(--accent-sf);
      color: var(--accent-dk);
      font-size: 0.72rem;
      font-weight: 750;
      padding: 0.18rem 0.55rem;
      border-radius: 6px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .slide-1-instructor-name {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.15;
    }
    .slide-1-instructor-titles {
      display: flex;
      flex-direction: column;
      gap: 0.30rem;
      margin-top: 0.20rem;
    }
    .slide-1-title-item {
      display: flex;
      align-items: center;
      gap: 0.50rem;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--ink);
    }
    .slide-1-title-item .title-icon {
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .slide-1-org-link {
      color: var(--accent-dk);
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s ease-in-out;
    }
    .slide-1-org-link:hover {
      color: var(--accent);
    }
    .slide-1-social-links {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 0.30rem;
      flex-wrap: wrap;
    }
    .slide-1-social-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.40rem;
      background: #FAF8F2;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.22rem 0.55rem;
      font-size: 0.86rem;
      color: var(--ink);
    }
    .slide-1-social-pill .social-icon {
      font-size: 0.95rem;
    }
    .slide-1-social-pill .social-label {
      font-weight: 600;
      color: var(--ink-muted);
    }
    .slide-1-social-link {
      color: var(--accent-dk);
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 2.5px;
      transition: color 0.15s ease-in-out;
    }
    .slide-1-social-link:hover {
      color: var(--accent);
    }
    .slide-1-social-link .ext-arrow {
      color: var(--accent);
      font-weight: 800;
      font-size: 0.85em;
      text-decoration: none;
      display: inline-block;
    }
    .slide-1-pillars-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    @media (max-width: 900px) {
      .slide-1-pillars-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .slide-1-instructor-card {
        flex-direction: column;
        text-align: center;
        align-items: center;
      }
      .slide-1-instructor-badge {
        margin: 0 auto;
      }
      .slide-1-title-item {
        justify-content: center;
      }
      .slide-1-social-links {
        justify-content: center;
      }
    }
    .slide-1-pillar-pill {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      border-top: 3px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .slide-1-pillar-title {
      font-weight: 750;
      font-size: 0.88rem;
      color: var(--ink);
      margin-bottom: 0.15rem;
    }
    .slide-1-pillar-desc {
      font-size: 0.76rem;
      color: var(--ink-muted);
      line-height: 1.35;
    }

    
    /* Slide 6: Enhanced Universal Setup & Command Blocks with Copy Buttons */
    .setup-slide-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.90fr) minmax(0, 1.35fr);
      gap: 0.95rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 1040px) {

  <script>
    const slidesData = [{"number": 1, "raw_lines": ["Claude 智能体驾驭工程实战大师课", "讲师：黄连金 (Ken Huang), CISSP", "旧金山大学兼职教授: https://www.usfca.edu/faculty/ken-huang", "云安全联盟 (CSA) 研究院副院长: https://cloudsecurityalliance.org/", "DistributedApps.ai 创始人兼 CEO: https://distributedapps.ai/", "Substack: https://kenhuangus.substack.com/", "LinkedIn: https://www.linkedin.com/in/kenhuang8/"]}, {"number": 2, "raw_lines": ["关于讲师：黄连金 (Ken Huang, CISSP)", "• 📚 AI 畅销书作者与技术学者 (《Harness Engineering》, 《MAESTRO》, Springer / Cambridge / Wiley 出版)", "• 🎓 旧金山大学兼职教授: https://www.usfca.edu/faculty/ken-huang", "• 🛡️ OWASP AIVSS (AI 验证安全标准) 项目负责人", "• 🤝 云安全联盟 (CSA) Fellow 兼两大 AI 安全工作组联合主席", "• 🔟 OWASP Top 10 for LLM Applications 核心成员", "• 🏛️ AIUC-1 AI 联盟成员", "• 🔬 施密特科学基金会 (Schmidt Sciences) 评审委员会成员", "• 🧑‍🏫 EC-Council 导师 —— 生成式 AI 网络安全", "• 🚀 DistributedApps.ai 创始人兼 CEO: https://distributedapps.ai/", "• ✍️ 专栏 Substack: https://kenhuangus.substack.com/ | 💼 领英 LinkedIn: https://www.linkedin.com/in/kenhuang8/"]}, {"number": 3, "raw_lines": ["大师课核心论点：传统软件工程 vs. 智能体驾驭工程 (Harness Engineering)", "确定性 IT 工程体系 ➔ 非确定性 Agentic AI 控制系统", "• 传统软件工程体系 (Traditional SE)：为确定性 IT 系统设计，通过结构化生命周期框架（SDLC、Agile、DevOps、CI/CD、架构设计模式、测试金字塔、SRE 以及安全开发流程 DevSecOps），对明确编码的逻辑进行严格管控，确保相同输入必然产生确定、可重复的输出。", "• 智能体驾驭工程 (Harness Engineering)：专门为非确定性 Agentic AI 系统创立的全新工程学科。在智能体系统中，运行时行为是由底层大模型、动态 Prompt 上下文、记忆持久化、工具调用、自主循环、安全策略、自动化评估及多智能体编排共同概率性涌现的。", "• 智能体驾驭框架 (Harness)的核心使命：在概率性大模型周围构建确定性的软件控制与安全驾驭环境，使非确定性智能体系统具备高可靠性 (Reliable)、可观测性 (Observable)、内生安全 (Secure)、可驾驭性 (Governable) 和工业级可维护性。", "• 确定性控制层五大支柱：记忆体系 (CLAUDE.md / AGENTS.md) · 路径沙箱 (Path.is_relative_to()) · 拦截钩子 (PreToolUse / PostToolUse) · 测试反馈环 (Pytest TDA) · 提权网关 (approvals.json)。"]}, {"number": 4, "raw_lines": ["全课程全景知识大纲 (COURSE MASTER MAP)", "第一部分：基础架构与确定性控制 ➔ 第二部分：生产级可靠性与团队协同", "• 第一部分：基础架构与确定性控制", "  • 模块 1：为什么需要智能体驾驭工程 (Why Harness Engineering)", "  • 模块 2：核心驾驭架构五大支柱 (Core Harness Stack) (Core Harness Stack)", "  • 模块 3：规范驱动开发 (Spec-Driven Development)", "  • 模块 4：确定性防护栏与拦截钩子 (Guardrails & Hooks)", "  • 模块 5：权限提权网关与审计账本 (Permission Gateways)", "• 第二部分：生产级可靠性与多智能体协同", "  • 模块 6：测试作为智能体可靠性基石 (Tests as Reliability)", "  • 模块 7：智能体扩展机制 (Skills, Plugins, MCP 协议)", "  • 模块 8：复合智能体系统与 Worktree 隔离 (Compound Engineering)", "  • 模块 9：五步端到端生产 SOP 流程 (Five-Step SOP Pipeline)", "  • 模块 10：四大驾驭原则与五道生产就绪准入审计 (Principles & Audit)"]}, {"number": 5, "raw_lines": ["模块 1：为什么需要智能体驾驭工程", "概率性模型 vs. 确定性控制系统", "• 模型能力 ≠ 生产可靠性：大模型生成速度极快，但在缺乏外部约束与安全驾驭的情况下，极易陷入失忆、幻觉、目标漂移与无限重试陷阱。", "• 概率性模型层 (Probabilistic Model Layer)：负责代码生成与推理提议；天生具有不确定性，无法自主保证架构一致性与边界安全。", "• 确定性驾驭层 (Deterministic Harness Layer)：负责运行环境约束、AST 语法解析、死循环阻断、最小特权沙箱隔离与凭据泄露扫描。", "• 智能体四大经典失效模式：上下文衰减遗忘、重复死循环试错、破坏性终端命令调用、未经语法与测试校验的代码落盘。", "• 核心驾驭原则：外部 智能体驾驭框架 (Harness)才是最终的控制中枢 —— 优先追求确定性与安全信任，而非无约束的原始生成速度。"]}, {"number": 6, "raw_lines": ["统一环境配置与实战运行指南", "全套 10 个模块代码实验的标准化终端运行流程", "• 首次上手？只需一次配置，后续所有实验模块均保持一致运行机制：", "  • 步骤 1 - 克隆代码库 (必须使用 git clone，模块 8 的 Worktree 机制依赖 .git 目录): git clone https://github.com/kenhuangus/agent-harness-chinese.git", "  • 步骤 2 - 进入项目目录并创建虚拟环境: cd agent-harness-chinese 接着执行 python -m venv .venv", "  • 步骤 3 - 激活虚拟环境并以可编辑模式安装: .venv\\Scripts\\python.exe -m pip install -e . (macOS/Linux: .venv/bin/python -m pip install -e .)", "  • 步骤 4 - 运行全套测试验证环境: python run_all_modules.py (预期输出 Summary: 14 passed, 0 failed)", "  • 为什么必须使用专属 venv：各模块底层通过 sys.executable 启动 pytest 子进程，确保测试环境与当前解释器严格一致，杜绝 PATH 污染。", "  • 环境变量配置示例 (.env.example): https://github.com/kenhuangus/agent-harness-chinese/blob/main/.env.example", "  • 完整配置说明与多云模型 Key 接入 (OpenAI, Claude, Gemini): https://github.com/kenhuangus/agent-harness-chinese/blob/main/README.md", "  • 交互式实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_01_why_harness_engineering/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_01_why_harness_engineering/harness_vs_model_demo.py", "code_language": "python", "highlight_lines": [8, 9, 10, 15, 16, 17, 18], "code_block": "class HarnessedAgent:\n    def __init__(self, max_retries: int = 2) -> None:\n        self.max_retries = max_retries\n        self.command_history: list[str] = []\n\n    def pre_execution_hook(self, command: str) -> None:\n        # 第 7-10 行: 确定性正则守卫，阻断破坏性终端命令调用\n        for pattern in FORBIDDEN_PATTERNS:  # ['rm -rf', 'sudo', 'chmod 777']\n            if re.search(pattern, command):\n                raise PermissionError(f\"BLOCKED BY PRE-HOOK: '{pattern}' detected.\")\n\n    def loop_detector(self, command: str) -> None:\n        # 第 13-18 行: 滑动窗口记忆阻断无限循环重试\n        self.command_history.append(command)\n        if len(self.command_history) >= self.max_retries:\n            recent = self.command_history[-self.max_retries:]\n            if len(set(recent)) == 1:\n                raise RuntimeError(f\"LOOP DETECTOR: '{command}' repeated {self.max_retries}x.\")", "raw_lines": ["模块 1 代码实战：前置执行拦截与循环试错检测器", "File: course_implementation/module_01_why_harness_engineering/harness_vs_model_demo.py", "• [第 8-10 行] 前置执行拦截 (Pre-Execution Interception)：采用确定性正则表达式匹配破坏性终端命令 (如 rm -rf, sudo, chmod 777)，在子进程创建前直接抛出 PermissionError 予以阻断。", "• [第 15-18 行] 循环检测器 (Loop Detector)：滑动窗口追踪最近执行历史，当检测到同一失败命令连续重复达到 max_retries 时触发 RuntimeError，安全打破无限重试陷阱。", "• 验证结论：未受驾驭约束的智能体会误删关键日志并无限重试；受 Harness 驾驭的智能体则安全拦截危险操作，确保关键日志完好无损 (log_survived=True)。"], "number": 7, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">HarnessedAgent</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">__init__</span>(<span class=\"tok-kw\">self</span>, max_retries: <span class=\"tok-typ\">int</span> = 2) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-kw\">self</span>.max_retries = max_retries</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        <span class=\"tok-kw\">self</span>.command_history: <span class=\"tok-typ\">list</span>[<span class=\"tok-typ\">str</span>] = []</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">pre_execution_hook</span>(<span class=\"tok-kw\">self</span>, command: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 7-10 行: 确定性正则守卫，阻断破坏性终端命令调用</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 8</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">for</span> pattern <span class=\"tok-kw\">in</span> <span class=\"tok-const\">FORBIDDEN_PATTERNS</span>:  <span class=\"tok-com\"># ['rm -rf', 'sudo', 'chmod 777']</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 9</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> <span class=\"tok-typ\">re</span>.<span class=\"tok-fn\">search</span>(pattern, command):</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">10</span><span class=\"key-badge\">核心</span><span class=\"line-code\">                <span class=\"tok-kw\">raise</span> <span class=\"tok-typ\">PermissionError</span>(f<span class=\"tok-str\">\"BLOCKED BY PRE-HOOK: '{pattern}' detected.\"</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">11</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">12</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">loop_detector</span>(<span class=\"tok-kw\">self</span>, command: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-kw\">None</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 13-18 行: 滑动窗口记忆阻断无限循环重试</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">        <span class=\"tok-kw\">self</span>.command_history.<span class=\"tok-fn\">append</span>(command)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">15</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-typ\">len</span>(<span class=\"tok-kw\">self</span>.command_history) &gt;= <span class=\"tok-kw\">self</span>.max_retries:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">16</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            recent = <span class=\"tok-kw\">self</span>.command_history[-<span class=\"tok-kw\">self</span>.max_retries:]</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">17</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> <span class=\"tok-typ\">len</span>(<span class=\"tok-typ\">set</span>(recent)) == 1:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">核心</span><span class=\"line-code\">                <span class=\"tok-kw\">raise</span> <span class=\"tok-typ\">RuntimeError</span>(f<span class=\"tok-str\">\"LOOP DETECTOR: '{command}' repeated {self.max_retries}x.\"</span>)</span></div>"}, {"number": 8, "raw_lines": ["模块 2：核心驾驭架构五大支柱 (Core Harness Stack)", "AI 编码智能体的工业级底层脚手架", "• 支柱 1：分层记忆系统 (Memory) —— 区分用户定义与模型自生成、短期工作记忆与长期持久记忆。", "• 支柱 2：受限工具与沙箱 (Scoped Tools) —— 最小特权工具白名单与 Path.is_relative_to() 路径穿越沙箱防御。", "• 支柱 3：确定性生命周期钩子 (Deterministic Hooks) —— 大驼峰 PreToolUse 与 PostToolUse AST 语法解析与秘钥过滤。", "• 支柱 4：Token 上下文预算管理 (Token Budgeting) —— 20/20/50/10 动态预算分配与首尾上下文智能压缩。", "• 支柱 5：结构化审计追踪 (Structured Tracing) —— events.jsonl 不可变追加式完整审计轨迹。"]}, {"number": 9, "raw_lines": ["支柱 1：Claude Code 记忆架构与 Auto Memory 机制", "Claude 如何记住项目上下文：CLAUDE.md 文件 vs. 自动记忆 (Auto Memory)", "• 双轨记忆架构：Claude Code 每次会话都从全新的上下文窗口启动。项目经验与规范通过两大互补体系实现持久化：开发者编写的 CLAUDE.md 规范文件与 Claude 自动维护的 Auto Memory 笔记。", "• CLAUDE.md vs. Auto Memory 核心对比：", "  • CLAUDE.md 体系：开发者主动编写；存放指令、编码标准与架构约束；支持组织级/用户级/项目级/局部多级作用域；每次会话启动全量加载。", "  • Auto Memory 体系 (~/.claude/projects/<project>/memory/)：Claude 自主提炼写入；记录构建命令、调试经验与已发现的用户偏好；启动时自动加载 MEMORY.md 的前 200 行 / 25KB 核心索引。", "  • 真实实战示例 (MEMORY.md): [C:\\Users\\kenhu\\.claude\\projects\\C--Users-kenhu-security-tools\\memory\\MEMORY.md](file:///C:/Users/kenhu/.claude/projects/C--Users-kenhu-security-tools/memory/MEMORY.md) (由 Claude Code 自动生成的真实索引与主题笔记)。", "• 多层级作用域优先级 (由全局到局部逐级覆盖):", "  • 1. 组织托管策略 (Managed Policy): 全局 IT 安全规范 (/etc/claude-code/CLAUDE.md 或 C:\\Program Files\\ClaudeCode\\CLAUDE.md)。", "  • 2. 用户级全局配置 (User Instructions): 跨项目个人偏好 (~/.claude/CLAUDE.md)。", "  • 3. 项目共享规范 (Project Instructions): 团队共享项目标准 (./CLAUDE.md 或 ./.claude/CLAUDE.md)。", "  • 4. 本地私有配置 (Local Instructions): 个人私有偏好；已添加至 gitignore (./CLAUDE.local.md)。", "  • 5. 路径局部规则 (Path-Scoped Rules): 位于 .claude/rules/*.md，按 glob 模式动态挂载 (paths: ['src/api/**/*.ts'])。", "• 模块化导入与 AGENTS.md 互操作性：支持使用 @path/to/import 语法引入外部规范 (递归支持 4 跳深度展开)。Claude Code 默认读取 CLAUDE.md，可通过在 CLAUDE.md 中引入 @AGENTS.md 或建立软链接 ln -s AGENTS.md CLAUDE.md 实现多智能体框架无缝兼容。", "• 上下文压缩持久性与强制执行边界：根目录 CLAUDE.md 在执行 /compact 上下文压缩后依然完整保留并重新注入。记忆文件用于引导智能体认知；非可妥协的安全边界必须通过 PreToolUse 钩子在代码层面刚性执行。", "• 官方文档索引: https://code.claude.com/docs/llms.txt (详细指南: https://code.claude.com/docs/en/memory)", "• 进阶研究与基准测试: https://kenhuangus.github.io/agent-memory-harness/presentation/#1"]}, {"number": 10, "raw_lines": ["支柱 2：受限工具与沙箱隔离 (Scoped Tools)", "最小特权原则在智能体环境中的刚性落地", "• 工具能力最小化：仅向智能体暴露当前任务所需的受限工具列表 (read_file, write_file, run_test, list_dir)。", "• 写入边界严格限制：所有文件修改与新增操作必须严格限定在当前 Workspace 工作区内部。", "• 阻断路径穿越攻击：使用 Path.resolve().is_relative_to() 彻底防御 ../ 路径越界与外部文件篡改。"]}, {"number": 11, "raw_lines": ["支柱 3：确定性钩子与 Claude Code 31 个生命周期事件全景图", "覆盖 6 大拦截维度的全生命周期确定性防护机制", "• 31 个生命周期钩子：Claude Code 提供了 31 个在大驼峰命名的生命周期事件（在 .claude/settings.json 中配置），实现对每次交互、终端命令、Git Worktree 及上下文压缩的精确编程式管控。", "• 1. 会话与交互轮次 (Session & Turn, 7 个钩子)：SessionStart, Setup (CI/自动化脚本配置), UserPromptSubmit, UserPromptExpansion, Stop, StopFailure, SessionEnd (管控环境初始化与会话退出清理)。", "• 2. 工具与执行循环 (Tool & Execution Loop, 6 个钩子)：PreToolUse (核心安全拦截；退出码 2 可直接阻断执行), PermissionRequest, PermissionDenied, PostToolUse (AST 语法解析与秘钥脱敏), PostToolUseFailure, PostToolBatch。", "• 3. 子智能体与团队编排 (Subagent & Team, 5 个钩子)：SubagentStart, SubagentStop (质检准入门禁), TeammateIdle, TaskCreated, TaskCompleted (在合并工作成果前严格执行 Definition of Done 验收)。", "• 4. 运行环境、配置与工作树 (Environment & Worktrees, 7 个钩子)：InstructionsLoaded (记忆加载), ConfigChange, CwdChanged, DirectoryAdded, FileChanged, WorktreeCreate, WorktreeRemove (临时 Git Worktree 独立隔离)。", "• 5. 上下文压缩管控 (Context Compaction, 2 个钩子)：PreCompact (拦截 Token 压力), PostCompact (在上下文压缩后重新注回核心项目规范)。", "• 6. MCP 协议与系统交互 (MCP Interaction, 4 个钩子)：Notification (桌面/Slack 通知), MessageDisplay, Elicitation, ElicitationResult (在向 MCP 服务发送前对用户输入进行安全审查)。"]}, {"number": 12, "raw_lines": ["支柱 4 与 5：Token 预算与审计追踪 (JSONL 审计日志)", "上下文智能分配与不可变日志规范 (~/.claude/projects/<encoded-path>/<session-id>.jsonl)", "• 支柱 4：Token 预算分配与智能压缩 (ContextTokenBudgeter 模块):", "  • 20/20/50/10 黄金预算比例：20% 记忆层 (CLAUDE.md/AGENTS.md)，20% 规范契约 (SPEC.md)，50% 工作区活跃代码与 Diff，10% 输出缓冲区。", "  • 首尾保留压缩 (Head/Tail Compaction)：完整保留对话前 5 轮与最近 15 轮交互，剔除中间冗余的噪声日志，有效防止目标漂移与上下文溢出。", "• 支柱 5：结构化审计追踪与 Claude Code JSONL 架构体系:", "  • 存储路径与格式：存放在 ~/.claude/projects/<encoded-project-path>/<session-id>.jsonl 中（每个会话独立 UUID，仅追加写入，每行一个完整 JSON 对象）。", "  • 标准顶层字段 Schema：type (user/assistant/system), uuid, parentUuid, timestamp (ISO 8601), sessionId, cwd, gitBranch 以及 version。", "  • 事件类型与有效载荷：type: 'user' (用户输入与 tool_result 工具执行结果), type: 'assistant' (文本思考、tool_use 工具调用块及 message.usage Token 消耗统计)。", "  • 自动化审计与分析命令 (jq/Python)：通过 jq -c 'select(.type==\"assistant\") | .message.content[] | select(.type==\"tool_use\") | {name, input}' 提取工具调用，或通过 .message.usage 精确核算 Token 成本。", "• 交互式实验演示: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_02_core_harness_stack/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_02_core_harness_stack/core_harness_stack.py", "code_language": "python", "highlight_lines": [4, 5, 11, 12, 13, 19, 20], "code_block": "class CoreHarnessStack:\n    def validate_tool_permission(self, tool_name: str, target_path: str = None) -> bool:\n        # 第 3-6 行: 最小特权工具白名单\n        allowed_tools = [\"read_file\", \"write_file\", \"run_test\", \"list_dir\"]\n        if tool_name not in allowed_tools:\n            self.log_event(\"PERMISSION_DENIED\", {\"tool\": tool_name})\n            return False\n\n        # 第 9-14 行: 路径沙箱隔离阻断跨目录越界 (../)\n        if target_path:\n            workspace = Path(self.workspace_root).resolve()\n            abs_target = Path(target_path).resolve()\n            if not abs_target.is_relative_to(workspace):\n                self.log_event(\"PATH_TRAVERSAL_BLOCKED\", {\"path\": str(abs_target)})\n                return False\n        return True\n\n    def run_post_edit_hook(self, file_path: str, code_content: str) -> bool:\n        # 第 19-21 行: 敏感秘钥扫描器阻断硬编码 API 凭证\n        if \"sk-proj-\" in code_content:\n            self.log_event(\"SECURITY_VIOLATION\", {\"file\": file_path, \"issue\": \"Secret key\"})\n            return False\n        return True", "raw_lines": ["模块 2 代码实战：工具权限校验、路径沙箱与后置秘钥扫描", "File: course_implementation/module_02_core_harness_stack/core_harness_stack.py", "• [第 4-5 行] 工具权限白名单：使用严格的工具注册表取代智能体无限制的调用能力，非白名单工具一律拒绝。", "• [第 11-13 行] 路径沙箱隔离：使用 Path.resolve().is_relative_to() 确保所有文件操作严格限定在当前工程工作区内部，阻断跨目录穿越。", "• [第 19-20 行] 后置秘钥扫描 (Post-Edit Secret Scan)：在文件写入落盘前实时扫描代码中的敏感凭据 (如 sk-proj-)，防止秘钥意外提交。", "• 审计可观测性：所有工具请求与钩子拦截判定均实时记录至 events.jsonl 审计日志中。"], "number": 13, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">CoreHarnessStack</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">validate_tool_permission</span>(<span class=\"tok-kw\">self</span>, tool_name: <span class=\"tok-typ\">str</span>, target_path: <span class=\"tok-typ\">str</span> = <span class=\"tok-kw\">None</span>) -&gt; <span class=\"tok-typ\">bool</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 3-6 行: 最小特权工具白名单</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 4</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        allowed_tools = [<span class=\"tok-str\">\"read_file\"</span>, <span class=\"tok-str\">\"write_file\"</span>, <span class=\"tok-str\">\"run_test\"</span>, <span class=\"tok-str\">\"list_dir\"</span>]</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> tool_name <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">in</span> allowed_tools:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 6</span><span class=\"line-code\">            <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">log_event</span>(<span class=\"tok-str\">\"PERMISSION_DENIED\"</span>, {<span class=\"tok-str\">\"tool\"</span>: tool_name})</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 9-14 行: 路径沙箱隔离阻断跨目录越界 (../)</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">10</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> target_path:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">11</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            workspace = <span class=\"tok-typ\">Path</span>(<span class=\"tok-kw\">self</span>.workspace_root).<span class=\"tok-fn\">resolve</span>()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            abs_target = <span class=\"tok-typ\">Path</span>(target_path).<span class=\"tok-fn\">resolve</span>()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">13</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">if</span> <span class=\"tok-kw\">not</span> abs_target.<span class=\"tok-fn\">is_relative_to</span>(workspace):</span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\">                <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">log_event</span>(<span class=\"tok-str\">\"PATH_TRAVERSAL_BLOCKED\"</span>, {<span class=\"tok-str\">\"path\"</span>: <span class=\"tok-typ\">str</span>(abs_target)})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">                <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">18</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">run_post_edit_hook</span>(<span class=\"tok-kw\">self</span>, file_path: <span class=\"tok-typ\">str</span>, code_content: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">bool</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">19</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 19-21 行: 敏感秘钥扫描器阻断硬编码 API 凭证</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">20</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-str\">\"sk-proj-\"</span> <span class=\"tok-kw\">in</span> code_content:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">21</span><span class=\"line-code\">            <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">log_event</span>(<span class=\"tok-str\">\"SECURITY_VIOLATION\"</span>, {<span class=\"tok-str\">\"file\"</span>: file_path, <span class=\"tok-str\">\"issue\"</span>: <span class=\"tok-str\">\"Secret key\"</span>})</span></div>\n<div class=\"code-line\"><span class=\"line-num\">22</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">23</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span></span></div>"}, {"number": 14, "raw_lines": ["模块 3：规范驱动开发 (Spec-Driven Development)", "为什么 Prompt 极易失效，而机器可验证契约才能保证生产确定性", "• Prompt 的天然局限：在长周期、多轮交互中，自然语言 Prompt 存在歧义、边界模糊且极易发生上下文漂移与记忆遗忘。", "• 机器可验证契约：通过结构化 SPEC.md 定义严格允许的文件范围、I/O 数据结构契约以及明确的非目标 (Non-Goals)。", "• 刚性边界防御：SpecVerifier 自动比对代码修改，直接拒绝未在 SPEC.md 声明的文件修改与越权写入。", "• 非目标过滤机制 (Non-Goals Filtering)：在代码落盘前主动拦截非预期的架构蔓延 (如未经允许引入数据库连接池或第三方 OAuth 依赖)。", "• 自动化语法准入校验：在保存前调用 ast.parse() 验证代码语法，并自动触发 pytest 测试套件完成端到端闭环验证。"]}, {"number": 15, "raw_lines": ["SPEC.md 规范契约核心结构解剖", "生产级智能体规范必须包含的四大结构化核心章节", "• 1. 目标与文件作用域 (Objective & Allowed Scope) —— 明确列出允许修改的文件列表与禁止触碰的核心文件。", "• 2. 明确的非目标 (Explicit Non-Goals) —— 明确声明严禁引入的架构扩展 (如禁止数据库持久化、禁止 OAuth2 轮换)。", "• 3. 输入/输出数据模式契约 (I/O Schemas) —— 规定函数的输入参数类型与严格的返回值字典结构 (token -> dict)。", "• 4. 机器可验证验收标准 (Acceptance Criteria) —— 定义结构化测试准则 (AC-01 至 AC-04)。"]}, {"number": 16, "raw_lines": ["作用域与非目标过滤机制 (Scope & Non-Goals)", "构建无法突破的代码安全驾驭防火墙", "• 允许修改文件 (Allowed Files)：auth_validator.py, test_auth.py", "• 禁止修改文件 (Forbidden Files)：database.py, config/settings.py", "• 非目标拦截 (Non-Goal)：自动拒绝未经许可的 connect_db 数据库连接与 OAuth2 凭证轮换代码。", "• 沙箱隔离绑定：底层通过 Path.is_relative_to() 确保所有操作完全限定在项目根目录下。"]}, {"number": 17, "raw_lines": ["机器可验证验收标准 (Acceptance Criteria)", "将需求转化为自动化测试可执行的严密判定", "• AC-01：导出 validate_jwt(token: str) -> dict 核心校验函数。", "• AC-02：有效 JWT 返回 valid=True, user_id=123 结构化数据。", "• AC-03：过期 JWT 返回 valid=False, error=EXPIRED 明确错误标识。", "• AC-04：必须通过 test_auth.py 中所有自动化单元测试与边界断言。"]}, {"slide_type": "code", "code_filename": "course_implementation/module_03_spec_driven_development/spec_driven_verifier.py", "test_suite": "course_implementation/module_03_spec_driven_development/output/tests", "code_language": "python", "highlight_lines": [6, 7, 10, 11, 12, 18], "code_block": "class SpecVerifier:\n    def attempt_write(self, target_file: str, code: str) -> tuple[bool, str]:\n        relative = self._normalized(target_file)\n        dest = (self.workspace / relative).resolve()\n\n        # 第 6-8 行: 严格范围边界 - 仅允许写入 SPEC.md 中声明的文件\n        if relative not in self.allowed_files or relative in self.forbidden_files:\n            return False, \"SCOPE_VIOLATION\"  # 阻断 database.py 等越权文件\n\n        # 第 10-13 行: 非目标过滤器阻断未授权的架构蔓延\n        lowered = code.lower()\n        if \"database\" in lowered or \"connect_db\" in lowered or \"oauth2\" in lowered:\n            return False, \"NON_GOAL_VIOLATION\"  # 阻断未授权的数据库连接\n\n        # 第 16-19 行: 语法校验确保代码在写入落盘前必然可解析编译\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_text(code, encoding=\"utf-8\")\n        ast.parse(code, filename=str(dest))\n        return True, str(dest)", "raw_lines": ["模块 3 代码实战：SPEC 范围约束与 AST 语法预检", "File: course_implementation/module_03_spec_driven_development/spec_driven_verifier.py", "• [第 6-7 行] 文件范围白名单：严格比对 SPEC.md 中的 allowed_files，自动拒绝未经审批的文件写入 (如越权创建 database.py)。", "• [第 10-12 行] 非目标关键词过滤：扫描代码内容，阻止越权引入非目标架构蔓延 (例如在纯内存 JWT 验证器中引入数据库连接池)。", "• [第 18 行] AST 语法预检门禁：在落盘前调用 ast.parse() 编译抽象语法树，确保零语法错误代码进入工作区。"], "number": 18, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">SpecVerifier</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">attempt_write</span>(<span class=\"tok-kw\">self</span>, target_file: <span class=\"tok-typ\">str</span>, code: <span class=\"tok-typ\">str</span>) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        relative = <span class=\"tok-kw\">self</span>.<span class=\"tok-fn\">_normalized</span>(target_file)</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        dest = (<span class=\"tok-kw\">self</span>.workspace / relative).<span class=\"tok-fn\">resolve</span>()</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 5</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 6-8 行: 严格范围边界 - 仅允许写入 SPEC.md 中声明的文件</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 7</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> relative <span class=\"tok-kw\">not</span> <span class=\"tok-kw\">in</span> <span class=\"tok-kw\">self</span>.allowed_files <span class=\"tok-kw\">or</span> relative <span class=\"tok-kw\">in</span> <span class=\"tok-kw\">self</span>.forbidden_files:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span>, <span class=\"tok-str\">\"SCOPE_VIOLATION\"</span>  <span class=\"tok-com\"># 阻断 database.py 等越权文件</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 9</span><span class=\"line-code\"></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">10</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 10-13 行: 非目标过滤器阻断未授权的架构蔓延</span></span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">11</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        lowered = code.<span class=\"tok-fn\">lower</span>()</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">12</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> <span class=\"tok-str\">\"database\"</span> <span class=\"tok-kw\">in</span> lowered <span class=\"tok-kw\">or</span> <span class=\"tok-str\">\"connect_db\"</span> <span class=\"tok-kw\">in</span> lowered <span class=\"tok-kw\">or</span> <span class=\"tok-str\">\"oauth2\"</span> <span class=\"tok-kw\">in</span> lowered:</span></div>\n<div class=\"code-line\"><span class=\"line-num\">13</span><span class=\"line-code\">            <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">False</span>, <span class=\"tok-str\">\"NON_GOAL_VIOLATION\"</span>  <span class=\"tok-com\"># 阻断未授权的数据库连接</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">14</span><span class=\"line-code\"></span></div>\n<div class=\"code-line\"><span class=\"line-num\">15</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 16-19 行: 语法校验确保代码在写入落盘前必然可解析编译</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\">16</span><span class=\"line-code\">        dest.parent.<span class=\"tok-fn\">mkdir</span>(parents=<span class=\"tok-kw\">True</span>, exist_ok=<span class=\"tok-kw\">True</span>)</span></div>\n<div class=\"code-line\"><span class=\"line-num\">17</span><span class=\"line-code\">        dest.<span class=\"tok-fn\">write_text</span>(code, encoding=<span class=\"tok-str\">\"utf-8\"</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\">18</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        ast.<span class=\"tok-fn\">parse</span>(code, filename=<span class=\"tok-typ\">str</span>(dest))</span></div>\n<div class=\"code-line\"><span class=\"line-num\">19</span><span class=\"line-code\">        <span class=\"tok-kw\">return</span> <span class=\"tok-kw\">True</span>, <span class=\"tok-typ\">str</span>(dest)</span></div>"}, {"number": 19, "raw_lines": ["模块 4：确定性防护栏、拦截钩子与四层纵深防御", "为工具调用构建多层纵深防御控制体系", "• 第 1 层 (系统提示词 Layer 1)：CLAUDE.md 与 AGENTS.md 中声明的项目长期规则与记忆约束。", "• 第 2 层 (工具 Schema 校验 Layer 2)：强类型的 JSON Schema 参数约束与非法参数校验。", "• 第 3 层 (生命周期钩子 Layer 3)：大驼峰命名 PreToolUse 参数拦截与 PostToolUse AST 语法解析 / 敏感秘钥脱敏。", "• 第 4 层 (操作系统沙箱 Layer 4)：基于解析路径的目录隔离与进程级最小特权控制。", "• 确定性防御原则：所有安全策略均必须由代码逻辑确定性强制执行，绝不依赖大模型的自觉性。", "• 实验指南: https://github.com/kenhuangus/agent-harness-chinese/blob/main/course_implementation/module_04_guardrails_and_hooks/README.md"]}, {"slide_type": "code", "code_filename": "course_implementation/module_04_guardrails_and_hooks/guardrails_engine.py", "code_language": "python", "highlight_lines": [5, 6, 12, 13, 14, 15, 22, 23], "code_block": "class ClaudeCodeHookInterceptor:\n    def intercept_pre_tool_use(self, tool_name: str, tool_input: dict) -> tuple[bool, str]:\n        # 第 3-7 行: 拦截企图绕过安全权限的危险 CLI 参数\n        command = tool_input.get(\"command\", \"\")\n        if tool_name == \"Bash\":\n            for flag in [\"--dangerously-skip-permissions\", \"-y\", \"--force-all\"]:\n                if flag in command:\n                    return False, f\"CLI flag '{flag}' prohibited by policy.\"\n        return True, \"PreToolUse check passed.\"\n\n    @classmethod\n    def permission_output(cls, decision: str, reason: str) -> dict:\n        # 第 12-16 行: 生成标准 Claude Code PreToolUse JSON 响应 Schema\n        return {\"hookSpecificOutput\": {\n            \"hookEventName\": \"PreToolUse\",\n            \"permissionDecision\": decision,  # 'allow' | 'deny' | 'ask' | 'defer'\n            \"permissionDecisionReason\": reason,\n        }}\n\nclass GuardrailsEngine:\n    def audit_ast_and_secrets(self, file_path: str, code_content: str) -> tuple[bool, list[str]]:\n        # 第 21-25 行: 多厂商敏感凭据扫描 + AST 语法解析预检\n        ast.parse(code_content, filename=file_path)\n        if re.search(r\"(sk-proj-[A-Za-z0-9_\\-]{20,}|AKIA[0-9A-Z]{16})\", code_content):\n            return False, [\"CRITICAL: Hardcoded API secret key detected!\"]\n        return True, [\"AST syntax valid. Zero secrets.\"]", "raw_lines": ["模块 4 代码实战：PreToolUse 拦截器与 AST 秘钥扫描引擎", "File: course_implementation/module_04_guardrails_and_hooks/guardrails_engine.py", "• [第 5-6 行] 危险命令越权标志拦截：自动捕获并阻断企图绕过安全权限的 CLI 参数 (如 --dangerously-skip-permissions, -y)。", "• [第 12-15 行] Claude Code PreToolUse 标准输出：生成符合官方规范的 permissionDecision JSON 响应 (allow, deny, ask, defer)。", "• [第 22-23 行] AST 语法分析与多厂商秘钥检测：解析 Python AST 语法树并使用正则扫描云厂商秘钥 (OpenAI sk-proj-, AWS AKIA)。"], "number": 20, "highlighted_code": "<div class=\"code-line\"><span class=\"line-num\"> 1</span><span class=\"line-code\"><span class=\"tok-kw\">class</span> <span class=\"tok-cls\">ClaudeCodeHookInterceptor</span>:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 2</span><span class=\"line-code\">    <span class=\"tok-kw\">def</span> <span class=\"tok-fn\">intercept_pre_tool_use</span>(<span class=\"tok-kw\">self</span>, tool_name: <span class=\"tok-typ\">str</span>, tool_input: <span class=\"tok-typ\">dict</span>) -&gt; <span class=\"tok-typ\">tuple</span>[<span class=\"tok-typ\">bool</span>, <span class=\"tok-typ\">str</span>]:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 3</span><span class=\"line-code\">        <span class=\"tok-com\"># 第 3-7 行: 拦截企图绕过安全权限的危险 CLI 参数</span></span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 4</span><span class=\"line-code\">        command = tool_input.<span class=\"tok-fn\">get</span>(<span class=\"tok-str\">\"command\"</span>, <span class=\"tok-str\">\"\"</span>)</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 5</span><span class=\"key-badge\">核心</span><span class=\"line-code\">        <span class=\"tok-kw\">if</span> tool_name == <span class=\"tok-str\">\"Bash\"</span>:</span></div>\n<div class=\"code-line code-line-hl\"><span class=\"line-num\"> 6</span><span class=\"key-badge\">核心</span><span class=\"line-code\">            <span class=\"tok-kw\">for</span> flag <span class=\"tok-kw\">in</span> [<span class=\"tok-str\">\"--dangerously-skip-permissions\"</span>, <span class=\"tok-str\">\"-y\"</span>, <span class=\"tok-str\">\"--force-all\"</span>]:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 7</span><span class=\"line-code\">                <span class=\"tok-kw\">if</span> flag <span class=\"tok-kw\">in</span> command:</span></div>\n<div class=\"code-line\"><span class=\"line-num\"> 8</span><span class=\"line-code\">                    <span class=\"tok-kw
